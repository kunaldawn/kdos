# Port repositories: the recipe tree every image carries at /ports, and the
# areas of src/ under it that hold ports of our own
PORT_REPO="${PORT_REPO:-/ports/core /ports/src/system /ports/src/art /ports/src/desktop /ports/src/daemons}"

# Package cache directories
SOURCE_DIR="${SOURCE_DIR:-/var/cache/kpkg/sources}"
PACKAGE_DIR="${PACKAGE_DIR:-/var/cache/kpkg/packages}"
WORK_DIR="${WORK_DIR:-/var/cache/kpkg/work}"

# Package database
PKGDB_DIR="${PKGDB_DIR:-/var/lib/kpkg/db}"
