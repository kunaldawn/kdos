<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  kdos-settingsd: org.freedesktop.hostname1, timedate1 and locale1.

  Only root may own the three names, so no other process can stand in for
  the daemon and collect a password prompt's answer. Anyone may call them:
  every method asks polkit itself, with the caller's own bus name as the
  subject, and the properties are what a settings page shows.
-->

<busconfig>
	<policy user="root">
		<allow own="org.freedesktop.hostname1"/>
		<allow own="org.freedesktop.timedate1"/>
		<allow own="org.freedesktop.locale1"/>
	</policy>

	<policy context="default">
		<allow send_destination="org.freedesktop.hostname1"/>
		<allow receive_sender="org.freedesktop.hostname1"/>
		<allow send_destination="org.freedesktop.timedate1"/>
		<allow receive_sender="org.freedesktop.timedate1"/>
		<allow send_destination="org.freedesktop.locale1"/>
		<allow receive_sender="org.freedesktop.locale1"/>
	</policy>
</busconfig>
