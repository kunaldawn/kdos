<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  io.kdos.Power1, kdos-powerd's face on the system bus.

  Root owns the name; anybody may call it. The bus decides who reaches the
  methods and polkit decides who may change anything (io.kdos.firewall.set,
  io.kdos.accent.set, io.kdos.filesharing.start), asked by the daemon about
  each caller. A policy that narrowed the callers here would be a second gate
  beside polkit that a rules file could not see.
-->
<busconfig>
  <policy user="root">
    <allow own="io.kdos.Power1"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.kdos.Power1"
           send_interface="io.kdos.Power1"/>
    <allow send_destination="io.kdos.Power1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.kdos.Power1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.kdos.Power1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
