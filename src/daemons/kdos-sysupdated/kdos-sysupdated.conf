<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  kdos-sysupdated: org.freedesktop.sysupdate1 and io.kdos.Slots1.

  Only root may own the two names, so no other process can stand in for the
  daemon, offer an update of its own or collect a password prompt's answer.
  Anyone may call them: every method that changes anything asks polkit
  itself, with the caller's own bus name as the subject, and the rest is
  what Discover and the System Versions page show.

  There is no activation file: the supervisor starts the daemon at boot
  (46_sysupdated.sh), and a bus that started a second, unsupervised copy for
  an early caller would keep the supervised one from its names.
-->

<busconfig>
	<policy user="root">
		<allow own="org.freedesktop.sysupdate1"/>
		<allow own="io.kdos.Slots1"/>
	</policy>

	<policy context="default">
		<allow send_destination="org.freedesktop.sysupdate1"/>
		<allow receive_sender="org.freedesktop.sysupdate1"/>
		<allow send_destination="io.kdos.Slots1"/>
		<allow receive_sender="io.kdos.Slots1"/>
	</policy>
</busconfig>
