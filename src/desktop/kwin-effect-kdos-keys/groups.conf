# ╚═╝  ╚═╝╚═════╝  ╚═════╝ ╚══════╝
# ---------------------------------
#   Which group of the key card a global shortcut is listed in.
#
#   <group> <component> <action>
#
# One rule a line. <group> is one of windows, desktops, launch, kdos,
# accessibility and system. <component> is kglobalaccel's unique name for
# the component — `kwin`, `plasmashell`, a desktop entry's file name such as
# `org.kde.konsole.desktop` — and <action> is the rest of the line, the
# action's unique name (`_launch` for a desktop entry's own key). Both are
# patterns in which `*` is any run of characters and `?` any one. A
# component whose name holds a space is written in double quotes.
#
# THE FIRST RULE THAT MATCHES WINS, so a narrow rule goes above the broad one
# it carves out of.
#
# The rules below the `---` line are the fallbacks, which place a shortcut
# no rule above names. kdos-keycard-gen --check holds every entry of the
# shipped kglobalshortcutsrc, every KDOS desktop entry that holds a key and
# every KWin shortcut KDOS's own scripts and effects register against the
# rules ABOVE the line, so a chord KDOS ships is never listed
# by accident; the fallbacks are for what an application registers that
# nobody here has read.
# ---------------------------------

# ── KDOS's own ───────────────────────────────────────────────────────
kdos          kwin                              KDOS *
kdos          org.kdos.*.desktop                *

