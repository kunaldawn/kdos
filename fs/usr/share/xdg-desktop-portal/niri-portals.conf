# KDOS portal backend selection for the niri session.
#
# xdg-desktop-portal picks a backend per interface using
# /usr/share/xdg-desktop-portal/$XDG_CURRENT_DESKTOP-portals.conf.
# 10-wayland.sh exports XDG_CURRENT_DESKTOP=niri, so this is the file it reads.
#
# Upstream niri ships a conf preferring gnome;gtk; — neither exists on the host
# (rule #3, no GTK), so without this file the portal has no declared preference
# and backend selection is whatever happens to be installed. KDOS ships exactly
# one backend, xdg-desktop-portal-wlr, which implements ScreenCast and
# Screenshot. Interfaces it does not implement (FileChooser, Settings) have no
# backend and fail cleanly — apps then use their own built-in dialogs, which is
# what already happens today.

[preferred]
default=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
