# The console session's backends. XDG_CURRENT_DESKTOP is KDOS-Console:KDOS
# there, and xdg-desktop-portal reads the FIRST file it finds for any name in
# that list — so this one is read on the console and kdos-portals.conf is read
# under the compositor.
#
# THE ONE LINE THAT DIFFERS IS ScreenCast. xdg-desktop-portal-wlr is a Wayland
# client and there is no compositor on this path, so it would start, fail to
# connect and leave the interface with a backend that is not there. The KDOS
# backend starts `kdos-view --cast` instead: a view that rasterises into a
# PipeWire stream rather than onto a screen.
#
# Screenshot has no backend here at all. `kdos-shot` writes the grid as text and
# is the screenshot on this desktop; a portal that answered with a picture would
# have to rasterise one, which is the cast's job and not a still image's.
[preferred]
default=none
org.freedesktop.impl.portal.ScreenCast=kdos
org.freedesktop.impl.portal.FileChooser=kdos
org.freedesktop.impl.portal.Settings=kdos
org.freedesktop.impl.portal.AppChooser=kdos
