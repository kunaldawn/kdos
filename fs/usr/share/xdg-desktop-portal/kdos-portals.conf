# Which portal backend serves which interface, for XDG_CURRENT_DESKTOP=KDOS.
#
# The name of this file is not free: xdg-desktop-portal looks for
# <desktop>-portals.conf with the desktop name lowercased, so KDOS -> kdos.
# Without it the only thing that selects a backend is the UseIn= line inside
# wlr.portal, which lists sway, river, Hyprland and friends and has never heard
# of us — so ScreenCast would come back with no backend at all.
#
# default=none is still honest rather than lazy. There is no GTK on the KDOS
# host, so xdg-desktop-portal-gtk — the backend every other desktop falls back
# to — cannot exist here, and Print, Email, Wallpaper and the rest genuinely
# have nobody to serve them. A portal that would only ever fail is not
# advertised.
#
# FileChooser and Settings are OURS now (xdg-desktop-portal-kdos). Before that
# every boxed application's Open and Save dialog fell back to whatever its own
# toolkit shipped, which put a rounded antialiased GTK dialog in the middle of a
# text-mode desktop every time anybody opened a file. The backend spawns
# kdos-pick and reads its stdout; Settings answers `color-scheme = 1` (KDOS has
# no light palette) and the accent from the same one-word cache file kdos-shell
# and kdos-comp read.
[preferred]
default=none
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.FileChooser=kdos
org.freedesktop.impl.portal.Settings=kdos
# OpenURI is "open this on the host for me", which is what a containerised
# application asks whenever a link or a downloaded file is clicked. With no
# backend it answered not-supported and the click did nothing at all, silently.
# The implementation is `kdos-appbox open` — the program that already knows
# what opens a file on this machine — with xdg-open for anything that is a
# scheme rather than a path.
org.freedesktop.impl.portal.OpenURI=kdos
