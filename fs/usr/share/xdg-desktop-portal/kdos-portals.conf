# Which portal backend serves which interface, for XDG_CURRENT_DESKTOP=KDOS.
#
# The name of this file is not free: xdg-desktop-portal looks for
# <desktop>-portals.conf with the desktop name lowercased, so KDOS -> kdos.
# Without it the only thing that selects a backend is the UseIn= line inside
# wlr.portal, which lists sway, river, Hyprland and friends and has never heard
# of us — so ScreenCast would come back with no backend at all.
#
# default=none is honest rather than lazy: an interface named nowhere below
# has no backend, and a portal that would only ever fail is not advertised.
# xdg-desktop-portal-gtk is on the host, but it is the backend every other
# desktop falls back to, and letting it answer by default would put a GTK file
# chooser and access dialog in front of the KDOS ones. It is named
# for exactly two interfaces: Print, the print dialog a GTK_USE_PORTAL
# application routes through the portal, and Email, the "compose a mail with
# this attached" request, which it hands to the x-scheme-handler/mailto
# default. Wallpaper, Inhibit, Notification and the rest stay unanswered.
#
# FileChooser and Settings are xdg-desktop-portal-kdos. Without a FileChooser
# backend every boxed application's Open and Save dialog falls back to whatever
# its own toolkit ships. The backend spawns kdos-pick and reads its stdout.
# Settings answers the accent from the same one-word cache file kdos-shell and
# kdos-comp read, and `color-scheme = 1`, "prefer dark", under every accent,
# the light `paper` one included: a boxed GTK or libadwaita application draws
# dark even on a `paper` desktop.
[preferred]
default=none
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.FileChooser=kdos
org.freedesktop.impl.portal.Settings=kdos
org.freedesktop.impl.portal.Print=gtk
org.freedesktop.impl.portal.Email=gtk
# OpenURI — "open this on the host for me", what a containerised application
# asks whenever a link or a downloaded file is clicked — is the FRONT END's
# own portal; it launches the host's handler itself and exports the interface
# only when a backend answers AppChooser, which is the choice among the
# handlers it found. kdos answers it with the last choice or the first.
org.freedesktop.impl.portal.AppChooser=kdos
# Access is the grant-or-deny question the front end asks before Camera and
# Screenshot hand any application anything, and before Location only for a
# Flatpak, Snap or Linyaps sandbox; it exports those three portals only when a
# backend answers Access. kdos answers it with kdos-prompt.
org.freedesktop.impl.portal.Access=kdos
