; ---------------------------------
;   The language Sonnet checks spelling in, until a person picks one.
;
; Without this key Sonnet takes the locale's name for the language, and a
; locale with no dictionary of that name (C, or a language whose dictionary
; is not installed) matches none: spell-checking programs then fall back to
; whichever dictionary sorts first, and the Spell Check page of System
; Settings, which compares the saved language with the one it shows, opens
; already modified and asks to apply on every page switch. en_US is a
; dictionary both engines carry (hunspell-en and aspell-en).
;
; QSettings, which reads this file through XDG_CONFIG_DIRS as KDE/Sonnet.conf,
; takes only `;` for a comment. Applied on the Spell Check page, the choice
; lands in ~/.config/KDE/Sonnet.conf, which is read before this file.
; ---------------------------------

[General]
defaultLanguage=en_US
