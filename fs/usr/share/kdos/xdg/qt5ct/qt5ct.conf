; ---------------------------------
;   How a Qt 5 program looks, until `kdos theme` has run once.
;
; KDE's platform theme exists for Qt 6 only, so every Qt 5 program (VLC,
; KeePassXC, LMMS, Mumble…) loads qt5ct under the same platform theme name,
; `kde`. qt5ct reads ~/.config/qt5ct/qt5ct.conf alone; when a person has none,
; the first program to start copies the first qt5ct/qt5ct.conf found along
; XDG_CONFIG_DIRS into place, and this is that file. From then on the copy is
; the person's, and `kdos theme` merges the accent's palette into it, key by
; key.
;
; QSettings, which reads this file, takes only `;` for a comment: a `#` line
; holding an equals sign is read as a key.
;
; The palette is bone's, from the KDOS colour files kdos-plasma-look
; generates; a path that does not exist leaves Qt's default palette. The
; fonts are the desktop's, in Qt 5's own font string.
; ---------------------------------

[Appearance]
color_scheme_path=/usr/share/qt5ct/colors/KDOS-Bone.conf
custom_palette=true
icon_theme=KDOS
standard_dialogs=default
style=Fusion

[Fonts]
fixed="JetBrains Mono,10,-1,5,50,0,0,0,0,0"
general="Noto Sans,10,-1,5,50,0,0,0,0,0"
