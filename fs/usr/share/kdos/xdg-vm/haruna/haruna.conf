# ---------------------------------
#   Software video decoding for Haruna in a virtual machine.
#
# Haruna's default, HWDecoding=auto, has libmpv try every hardware decoder.
# On a guest without 3D (virtio-gpu on llvmpipe) its render path then draws
# a black or corrupted picture even when each decoder fails to start, while
# the sound plays. `no` decodes on the CPU and draws the picture. The person's
# own ~/.config/haruna/haruna.conf still outranks this file.
# ---------------------------------
[Playback]
HWDecoding=no
