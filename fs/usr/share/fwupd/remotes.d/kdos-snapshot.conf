# ---------------------------------
#   The LVFS firmware metadata as of this KDOS release, offline.
#
# A local remote: fwupd reads the metadata file below and downloads nothing
# to list what firmware applies, so Discover's Updates page and
# `fwupdmgr get-updates` answer with no network. The file is the LVFS's own
# firmware.xml.zst, taken by ports/fwupd-snapshot on the day of the release,
# checked against the LVFS signature beside it, and installed by the
# fwupd-snapshot package; it is as current as the release that carries it.
#
# A cabinet is fetched from FirmwareBaseURI when somebody installs an update,
# and fwupd checks it against the hash this metadata records before flashing.
#
# The LVFS download remote ships disabled (fwupd's -Dlvfs=disabled): an
# enabled download remote is refreshed by Discover's firmware backend every
# time Discover starts. `fwupdmgr enable-remote lvfs` turns live metadata on,
# and OrderAfter lets it win over this snapshot once it has been fetched.
# ---------------------------------

[fwupd Remote]
Enabled=true
Title=KDOS firmware snapshot (Linux Vendor Firmware Service)
MetadataURI=file:///usr/share/fwupd/remotes.d/kdos-snapshot/firmware.xml.zst
FirmwareBaseURI=https://fwupd.org/downloads
PrivacyURI=https://lvfs.readthedocs.io/en/latest/privacy.html
OrderAfter=lvfs
ApprovalRequired=false
AutomaticReports=false
AutomaticSecurityReports=false
