# The hwmon drivers no uevent can name. A desktop board's fans, voltage rails
# and motherboard temperatures sit behind a Super-I/O chip — Nuvoton on most
# boards, ITE on most of the rest — and a SATA disk's temperature behind
# drivetemp. None of the three declares a modalias, so udev's autoload never
# reaches them, and without this file `sensors` and kdos-res show a desktop's
# CPU and GPU temperatures and nothing else.
#
# Each probes and binds only what it finds. On hardware without the chip, or
# where the firmware's ACPI tables have claimed its ports, the load fails with
# ENODEV or EBUSY and 02_modules.sh reports a skip. sensors-detect is not the
# route: it probes the SMBus by writing to it, and these three do not.
nct6775
it87
drivetemp
