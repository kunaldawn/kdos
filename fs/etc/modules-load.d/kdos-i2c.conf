# The character-device interface to the I2C buses, which is how ddcutil reaches
# a monitor's DDC/CI line. Built as a module and never autoloaded: i2c-dev
# declares no modalias, so no uevent names it and udev's autoload path cannot
# reach it. Without this line /dev/i2c-* does not exist and
# 70-kdos-i2c.rules has nothing to grant.
#
# ddcutil ships /usr/lib/modules-load.d/ddcutil.conf saying the same thing.
# 02_modules.sh reads /etc/modules-load.d only, so that copy is inert here.
i2c-dev
