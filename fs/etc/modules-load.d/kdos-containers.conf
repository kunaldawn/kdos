# Kernel modules for the container layer (podman + distrobox).
# tun: pasta, podman's rootless network, opens /dev/net/tun for its tap
#      device, and so does the standalone slirp4netns.
# overlay: the kernel's overlayfs. kdos-packd composes every pack box with it,
#          and so does rootless podman on an installed system, where
#          kdos-appbox gives the user a storage.conf without a
#          mount_program. /etc/containers/storage.conf pins fuse-overlayfs
#          for every other store, which the live ISO needs: $HOME there is
#          itself on an overlay.
tun
overlay
