# Kernel modules for the container layer (podman + distrobox).
# tun: slirp4netns needs it, and slirp4netns stays selectable per container
#      (`--network slirp4netns`). pasta, the rootless default, is user-mode
#      and needs no tap device, so this module is for the fallback alone.
# overlay: native overlayfs storage driver (rootful path; rootless uses fuse-overlayfs).
tun
overlay
