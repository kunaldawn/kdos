# The system locale. kdos-dm hands it to SDDM, and SDDM gives it to the login
# screen and to every session it starts; without a LANG line here SDDM sets
# LANG to C, the byte locale, for all of them. kdos-settingsd rewrites this
# file through org.freedesktop.locale1, as bare NAME and value lines only,
# so this comment goes with the first change. en_US.UTF-8 is the default:
# C.UTF-8 is Qt's C locale, which writes a date as "8 11 2026", has no
# currency sign and names no language for KDE's translations to load.
LANG=en_US.UTF-8
