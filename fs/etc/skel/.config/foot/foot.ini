# KDOS "PHOSPHOR" — green-screen terminal.
#
# Colours come from themes/kdos, included below and regenerated by
# `kdos theme`. Everything the generator does not write lives in this file,
# AFTER the include, because foot applies keys in the order it reads them.

[main]
include=~/.config/foot/themes/kdos

# Terminus is a bitmap font — no hinting, no antialiasing, one shape per pixel
# grid. It is what a text console actually looked like. fcft falls through to
# DejaVu when the pixelsize is unavailable or the PCFs are not installed, so
# this is safe on any machine.
#
# SIZE 16, NOT THE 32 THE WINDOW FRAMES USE, and the difference is deliberate.
# The chrome — frames, panels, menus — is drawn at the console's own 16x32 cell,
# because that is what makes the desktop look like tty1. A TERMINAL is content
# rather than chrome: at 32 pixels an 800-wide foot window is fifty columns,
# which is too narrow for mc's two panes or for anything else worth reading.
# Same typeface, same palette, half the cell. They are two grids, and the frame
# around a foot window will not line up with the text inside it.
font=Terminus:pixelsize=16,DejaVu Sans Mono:size=11
font-bold=Terminus:pixelsize=16:weight=bold,DejaVu Sans Mono:size=11:weight=bold
pad=10x8
dpi-aware=no
selection-target=clipboard

[cursor]
style=block
blink=yes
blink-rate=600

[colors-dark]
# Not touched by `kdos theme` — safe to keep here.
# A hint of translucency, so the phosphor glow bleeds through.
alpha=0.94
# <text> <cursor block>: black glyph on a phosphor block.
cursor=000a03 39ff14
urls=ffb000

[scrollback]
lines=10000
indicator-position=relative
indicator-format=percentage

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[bell]
urgent=yes
notify=no

[key-bindings]
scrollback-up-page=Control+Shift+Page_Up
scrollback-down-page=Control+Shift+Page_Down
scrollback-home=Control+Shift+Home
scrollback-end=Control+Shift+End
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
show-urls-launch=Control+Shift+u
unicode-input=Control+Shift+i

[mouse-bindings]
selection-override-modifiers=Shift
primary-paste=BTN_MIDDLE
