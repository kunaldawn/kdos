# KDOS "PHOSPHOR" — green-screen terminal. Palette shared with niri and fuzzel.

[main]
font=DejaVu Sans Mono:size=11
pad=10x8
dpi-aware=no

[cursor]
style=block
blink=yes

# foot 1.26 splits the palette per appearance; KDOS only ships the dark one.
[colors-dark]
# A hint of translucency, so niri's phosphor glow bleeds through.
alpha=0.94
background=000a03
foreground=b8ffc8
# <text> <cursor block>: black glyph on a phosphor block.
cursor=000a03 39ff14
selection-background=12401f
selection-foreground=39ff14
urls=ffb000

# Normal: green-forward, but ANSI stays recognisable.
regular0=04120a
regular1=ff3131
regular2=39ff14
regular3=ffb000
regular4=2f8fff
regular5=c77dff
regular6=25d0c0
regular7=b8ffc8

# Bright: hotter phosphor.
bright0=12401f
bright1=ff6b6b
bright2=7dff5c
bright3=ffd166
bright4=6bb6ff
bright5=e0aaff
bright6=68f5e6
bright7=e8ffee

[scrollback]
lines=10000

[key-bindings]
scrollback-up-page=Control+Shift+Page_Up
scrollback-down-page=Control+Shift+Page_Down
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
