# aerc's settings, and this file is SHORT ON PURPOSE. Every key not named below
# takes aerc's compiled-in default — not the value in /usr/share/aerc/aerc.conf,
# which aerc copies into a home that has no aerc.conf at all and never reads
# again once one exists. A line repeating a default would be a decision nobody
# made, and it would go stale the first time upstream changed its mind.
#
# THERE IS NO accounts.conf ON THIS IMAGE AND THERE MUST NOT BE ONE. aerc
# refuses to start on an accounts.conf that group or other can read, and every
# file the build ships is mode 644 — so a shipped one would be a mail client
# that does not open. With the file absent aerc runs its account wizard and
# writes the answers at mode 600, which is the state the check wants.
#
# binds.conf IS NOT SHIPPED EITHER. aerc's compiled-in bindings are EMPTY: the
# real defaults live in /usr/share/aerc/binds.conf, which aerc installs beside
# this file the first time it runs and then reads as the only source of
# bindings. A partial binds.conf here would therefore unbind every key it did
# not name, and a complete copy would drift from the binary at the next
# upgrade.

[general]
# Where `:save` puts an attachment when no path is given. aerc's own default is
# empty, which makes it ask every time. 00_user.sh creates this directory.
default-save-path=~/Downloads

# THE ACCENT'S STYLESET, written beside this file by `kdos theme`. A styleset
# is a file of its own rather than a section of this one, which is why an
# accent switch never rewrites what you put here — aerc has no include.
[ui]
styleset-name=kdos

[filters]
# THIS SECTION REPLACES THE WHOLE DEFAULT SET. [filters], [openers] and
# [multipart-converters] are the three parts of aerc's configuration with no
# compiled-in defaults behind them: aerc reads them out of this file and
# nowhere else. A type missing from the list below therefore gets aerc's
# "No filter configured for this mimetype" card with its :open/:save/:pipe
# hints — not a rendering — which is why the plain-text, delivery-status and
# header rows are repeated here rather than left to the file this one replaces.
#
# THE FIRST MATCHING ROW WINS, so they run most to least specific. A FILTER'S
# STDERR IS THE MESSAGE BODY — aerc hands it the pager's own pipe — so a row
# naming a command that is not on the image shows `sh: …: command not found`
# where the message should be. `colorize` is aerc's own filter and ships with
# it; every other row goes through one script, kdos-part, whose commands
# testing/preflight.sh checks against the image wherever one is the first word
# of a line.
text/plain=colorize
message/delivery-status=colorize
message/rfc822=colorize
# A READING, NOT AN IMPORT: the renderer writes nothing. A filter runs every
# time a message scrolls past, and one that imported an invitation would accept
# meetings by being looked at.
text/calendar=kdos-part ics
# w3m, BEHIND SOMETHING THAT CANNOT REACH THE NETWORK. kdos-part probes for a
# network namespace and falls back to an unroutable proxy, rather than testing
# whether the `unshare` BINARY exists the way aerc's own html filter does. On
# the live medium the namespace is refused to every process, root included, so
# that filter would put `unshare: Operation not permitted` where the message
# should be — and the probe is what makes the difference between a message
# without isolation and no message.
#
# THE PAGER IS KEPT, which upstream's `text/html=! html` gives up: that form
# makes the filter itself the pager so w3m can follow links interactively.
# kdos-part always passes -dump, so without the pager a long message would
# scroll past and stop.
text/html=kdos-part html
# ONE OF THESE NEEDS A FILE RATHER THAN A PIPE — mutool opens a document by
# path — and the other two ride the same script for one shape. See kdos-part.
application/pdf=kdos-part pdf
# THIS ROW TURNS OFF aerc's INLINE PICTURE. With no filter matching, aerc draws
# jpeg, png, bmp, tiff and webp through the terminal's own graphics protocol,
# which kdos-term has; with one, chafa's symbols are what everybody sees. That
# is the trade: the same picture in every terminal, including one with no
# graphics protocol at all, rather than a better one in some.
image/*=kdos-part image
application/vnd.openxmlformats-officedocument.wordprocessingml.document=kdos-part docx
.headers=colorize

[openers]
# EMPTY ON PURPOSE. With no row here aerc calls `xdg-open`, which on this image
# resolves through the same table the file managers, the desktop icons and the
# panel use. A row here would be a second answer to "what opens this", and the
# two would disagree the first time somebody changed one of them.
