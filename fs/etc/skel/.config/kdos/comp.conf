# ---------------------------------
#   kdos-comp — window manager settings
# ---------------------------------
#
# Everything below is commented out and shows the DEFAULT. Uncomment a line to
# change it. This file is parsed, never sourced: it is data, there is no shell
# anywhere in kdos-comp, and a `spawn` value is split on whitespace into argv
# and executed directly. One consequence, worth knowing before you hit it: an
# argument cannot contain a space. Put it in a script and spawn that.
#
# A line that does not parse is reported to the session log and skipped; the
# rest of the file still loads.

# Programs started once the session is up. Repeatable, and the first `startup`
# line in this file REPLACES the default rather than adding to it — otherwise
# there would be no way to stop the panel from starting, only ways to add more.
#startup = kdos-shell

# Key repeat: repeats per second, and the delay in ms before the first one.
#repeat_rate  = 25
#repeat_delay = 600

# How close to an edge a drag has to end for the window to snap. An edge fills
# a half, a corner fills a quarter, the top maximises. 0 turns snapping off.
#snap_px = 16

# ── keys ─────────────────────────────────────────────────────────────────────
#
#   bind <Mods>+<Key> = <action> [argument]
#
# Modifiers: Super (Logo, Mod4), Shift, Ctrl (Control), Alt (Mod1).
# Key names are xkb keysym names, matched case-insensitively — `Return`, `Tab`,
# `Escape`, `q`, `1`, `F4`, `XF86AudioRaiseVolume`.
#
# Actions:
#   spawn <command> [args...]   run a program (argv, no shell)
#   close                       ask the focused window to close
#   quit                        end the session
#   cycle / cycle-back          alt-tab through this workspace, most recent first
#   workspace <1-4>             go to a workspace
#   move-to-workspace <1-4>     send the focused window to one
#
# A binding MUST name at least one modifier. A bare key is refused, because a
# bare binding takes that key away from every application for the whole session
# — bind `q` and no text field can ever contain one, including the one you would
# use to undo it.
#
# Naming a combination that already exists replaces it rather than adding a
# second one, so the defaults below can simply be overridden in place.

#bind Super+Return    = spawn foot
#bind Super+D         = spawn kdos-launcher
#bind Super+q         = close
#bind Super+Escape    = quit
#bind Super+Tab       = cycle
#bind Super+Shift+Tab = cycle-back

#bind Super+1 = workspace 1
#bind Super+2 = workspace 2
#bind Super+3 = workspace 3
#bind Super+4 = workspace 4

#bind Super+Shift+1 = move-to-workspace 1
#bind Super+Shift+2 = move-to-workspace 2
#bind Super+Shift+3 = move-to-workspace 3
#bind Super+Shift+4 = move-to-workspace 4

# The mouse is not configurable here: Super+drag moves a window and
# Super+right-drag resizes it from the nearest corner. Those are bound to a
# modifier rather than to a titlebar because most KDOS windows are alien apps
# drawing their own decorations, and there is often no titlebar to aim at.
