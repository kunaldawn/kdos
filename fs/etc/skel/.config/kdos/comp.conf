# ---------------------------------
#   kdos-comp — KDOS-only settings
# ---------------------------------
#
# Everything below is commented out and shows the DEFAULT. Uncomment a line to
# change it. This file is parsed, never sourced. A line that does not parse is
# reported to the session log and skipped; the rest of the file still loads.
#
# ONLY the KDOS additions live here: the CRT pass, the idle policy and the
# wallpaper. Everything else about the window manager — keybinds, mouse,
# workspaces, window placement, decorations — is labwc configuration and lives
# in ~/.config/kdos-comp/rc.xml (kdos-comp is a hard fork of labwc; labwc's
# rc.xml documentation applies to it verbatim).

# The desktop background. A PNG, scaled to COVER the output and centred, so a
# wallpaper of the wrong aspect ratio is cropped rather than distorted. The
# word `none` is an honest off and prints nothing.
#wallpaper = /usr/share/backgrounds/kdos/default-wallpaper.png

# ── the CRT pass ─────────────────────────────────────────────────────────────
#
# The compositor renders the desktop through a phosphor shader: scanlines every
# third row, a horizontal bleed, a vignette, an optional tube curvature, and the
# faint glow a phosphor screen has even where nothing is drawn. It is the reason
# the boot splash, the TTY and the desktop finally look like one machine, and it
# is why the wallpaper no longer carries baked-in scanlines — two sets of them
# would beat against each other.
#
# All three are percentages. `crt = 0` is an honest OFF and the right answer if
# the fill rate is not there; the shader touches every pixel of every frame.
#
# It is forced off, whatever is written here, when the renderer is not GLES2 —
# `make run` with plain virtio-vga has only software rendering, and a fullscreen
# post-process on that is a slideshow rather than a look. The session log says
# so when it happens.
#
# One thing the pass costs: direct scanout is turned off while it is on. A
# fullscreen video can no longer be handed straight to the display controller,
# because a shader over the whole screen means the whole screen goes through the
# GPU. That is inherent, not an oversight.
#crt = 55

# The scanlines on their own — the component people either love or want gone.
#crt_scanlines = 60

# Tube curvature, off by default. It is the one effect that argues with a
# character grid, so it should be a decision rather than a surprise. Nothing is
# cropped at any value: the distortion is normalised so the corners still land
# on the corners.
#crt_curve = 0

# ── idle ─────────────────────────────────────────────────────────────────────
#
# Seconds of no keyboard or pointer activity before each step; 0 means never.
# They are cumulative and each is measured from the LAST ACTIVITY, not from the
# step before it, so these three read as they look.
#
# Activity ends the dim and powers the outputs back on. It does NOT unlock —
# only a password does that.
#
# A client holding an idle inhibitor (a video player, for instance) stops all of
# this for as long as it holds one.
#
# IN A VIRTUAL MACHINE ALL THREE DEFAULT TO 0, whatever is written here as the
# default below, because a blanked screen over VNC is indistinguishable from a
# crashed compositor and that has already cost a debugging afternoon. Setting
# ANY of the three in this file overrides that — including setting one to 0,
# which is how you say you mean it.
#idle_dim  = 300
#idle_lock = 600
#idle_off  = 900
