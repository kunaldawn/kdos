# ---------------------------------
#   kdos-comp — window manager settings
# ---------------------------------
#
# Everything below is commented out and shows the DEFAULT. Uncomment a line to
# change it. This file is parsed, never sourced: it is data, there is no shell
# anywhere in kdos-comp, and a `spawn` value is split on whitespace into argv
# and executed directly. One consequence, worth knowing before you hit it: an
# argument cannot contain a space. Put it in a script and spawn that.
#
# A line that does not parse is reported to the session log and skipped; the
# rest of the file still loads.

# Programs started once the session is up. Repeatable, and the first `startup`
# line in this file REPLACES the default rather than adding to it — otherwise
# there would be no way to stop the panel from starting, only ways to add more.
#startup = kdos-shell

# Key repeat: repeats per second, and the delay in ms before the first one.
#repeat_rate  = 25
#repeat_delay = 600

# How close to an edge a drag has to end for the window to snap. An edge fills
# a half, a corner fills a quarter, the top maximises. 0 turns snapping off.
#snap_px = 16

# ── the CRT pass ─────────────────────────────────────────────────────────────
#
# The compositor renders the desktop through a phosphor shader: scanlines every
# third row, a horizontal bleed, a vignette, an optional tube curvature, and the
# faint glow a phosphor screen has even where nothing is drawn. It is the reason
# the boot splash, the TTY and the desktop finally look like one machine, and it
# is why the wallpaper no longer carries baked-in scanlines — two sets of them
# would beat against each other.
#
# All three are percentages. `crt = 0` is an honest OFF and the right answer if
# the fill rate is not there; the shader touches every pixel of every frame.
#
# It is forced off, whatever is written here, when the renderer is not GLES2 —
# `make run` with plain virtio-vga has only software rendering, and a fullscreen
# post-process on that is a slideshow rather than a look. The session log says
# so when it happens.
#
# One thing the pass costs: direct scanout is turned off while it is on. A
# fullscreen video can no longer be handed straight to the display controller,
# because a shader over the whole screen means the whole screen goes through the
# GPU. That is inherent, not an oversight.
#crt = 55

# The scanlines on their own — the component people either love or want gone.
#crt_scanlines = 60

# Tube curvature, off by default. It is the one effect that argues with a
# character grid, so it should be a decision rather than a surprise. Nothing is
# cropped at any value: the distortion is normalised so the corners still land
# on the corners.
#crt_curve = 0

# ── idle ─────────────────────────────────────────────────────────────────────
#
# Seconds of no keyboard or pointer activity before each step; 0 means never.
# They are cumulative and each is measured from the LAST ACTIVITY, not from the
# step before it, so these three read as they look.
#
# Activity ends the dim and powers the outputs back on. It does NOT unlock —
# only a password does that.
#
# A client holding an idle inhibitor (a video player, for instance) stops all of
# this for as long as it holds one.
#
# IN A VIRTUAL MACHINE ALL THREE DEFAULT TO 0, whatever is written here as the
# default below, because a blanked screen over VNC is indistinguishable from a
# crashed compositor and that has already cost a debugging afternoon. Setting
# ANY of the three in this file overrides that — including setting one to 0,
# which is how you say you mean it.
#idle_dim  = 300
#idle_lock = 600
#idle_off  = 900

# ── keys ─────────────────────────────────────────────────────────────────────
#
#   bind <Mods>+<Key> = <action> [argument]
#
# Modifiers: Super (Logo, Mod4), Shift, Ctrl (Control), Alt (Mod1).
# Key names are xkb keysym names, matched case-insensitively — `Return`, `Tab`,
# `Escape`, `q`, `1`, `F4`, `XF86AudioRaiseVolume`.
#
# Actions:
#   spawn <command> [args...]   run a program (argv, no shell)
#   close                       ask the focused window to close
#   quit                        end the session
#   cycle / cycle-back          alt-tab through this workspace, most recent first
#   workspace <1-4>             go to a workspace
#   move-to-workspace <1-4>     send the focused window to one
#   lock                        lock the session (runs kdos-lock)
#
# `lock` rather than `spawn kdos-lock` so a second lock client is never started
# while one is live — the compositor refuses those, and a key that spawns a
# process which immediately exits is a key that looks broken.
#
# A binding MUST name at least one modifier. A bare key is refused, because a
# bare binding takes that key away from every application for the whole session
# — bind `q` and no text field can ever contain one, including the one you would
# use to undo it.
#
# Naming a combination that already exists replaces it rather than adding a
# second one, so the defaults below can simply be overridden in place.

#bind Super+Return    = spawn foot
#bind Super+D         = spawn kdos-launcher
#bind Super+q         = close
#bind Super+Escape    = quit
#bind Super+Tab       = cycle
#bind Super+Shift+Tab = cycle-back
#bind Super+l         = lock

#bind Super+1 = workspace 1
#bind Super+2 = workspace 2
#bind Super+3 = workspace 3
#bind Super+4 = workspace 4

#bind Super+Shift+1 = move-to-workspace 1
#bind Super+Shift+2 = move-to-workspace 2
#bind Super+Shift+3 = move-to-workspace 3
#bind Super+Shift+4 = move-to-workspace 4

# The media keys are bound with NO modifier, which the rule above otherwise
# refuses. They are the one safe exception: those keysyms exist only on those
# keys, so they cannot take anything away from an application.
#bind XF86AudioRaiseVolume  = spawn kdos-osd volume +5
#bind XF86AudioLowerVolume  = spawn kdos-osd volume -5
#bind XF86AudioMute         = spawn kdos-osd volume toggle
#bind XF86MonBrightnessUp   = spawn kdos-osd brightness +10
#bind XF86MonBrightnessDown = spawn kdos-osd brightness -10

# Power is deliberately NOT bound to a key by default: a misread XF86PowerOff
# on a laptop is a lost session. `kdos-power suspend|poweroff|reboot` is the
# command, and this is the bind if you want one.
#bind Super+Shift+Escape = spawn kdos-power suspend

# The mouse is not configurable here: Super+drag moves a window and
# Super+right-drag resizes it from the nearest corner. Those are bound to a
# modifier rather than to a titlebar because most KDOS windows are alien apps
# drawing their own decorations, and there is often no titlebar to aim at.
