# ---------------------------------
#   kdos-comp — KDOS-only settings
# ---------------------------------
#
# Everything below is commented out and shows the DEFAULT. Uncomment a line to
# change it. This file is parsed, never sourced. A line that does not parse is
# reported to the session log and skipped; the rest of the file still loads.
#
# ONLY the KDOS additions live here: the CRT pass, the idle policy and the
# wallpaper. Everything else about the window manager — keybinds, mouse,
# workspaces, window placement, decorations — is labwc configuration and lives
# in ~/.config/kdos-comp/rc.xml (kdos-comp is a hard fork of labwc; labwc's
# rc.xml documentation applies to it verbatim).

# The desktop background. A PNG, scaled to COVER the output and centred, so a
# wallpaper of the wrong aspect ratio is cropped rather than distorted. The
# word `none` is an honest off and prints nothing.
#wallpaper = /usr/share/backgrounds/kdos/default-wallpaper.png

# ── the chrome the compositor supervises ─────────────────────────────────────
#
# THERE IS ONE TASKBAR, on the bottom edge. There used to be two panels — a
# menu bar at the top and a second panel at the bottom — which is two exclusive
# zones, two hit maps and the window list drawn twice; on a 1280x800 screen
# with the 32-pixel font that was 8% of the display spent saying the same thing
# at both ends of it.
#
# `panel` moves it or turns it off:  bottom (the default) | top | off
# `panel_cells` is its thickness in CELLS. Two is the default: the second row
# is a detail line — the clock's date, the meters strip — and two rows is what
# makes a task button tall enough to carry an icon and a state marker at once.
# One row is the bar as it was before the icon layer, and everything on it
# still works.
#
#panel       = bottom
#panel_cells = 2

# THE BAR'S THICKNESS IS ITS FONT SIZE, and this is the knob for it. A cell is
# half as wide as the font is tall, so Terminus at 20 is a 10x20 cell and a
# two-row bar 40 pixels high — the height a taskbar has had since Windows 7.
# `chrome_font` below stays at the console's own 32 for the menus and the
# popups, which are read rather than glanced at; this key is what lets the two
# differ. The panel does not pass its font on to the surfaces it opens, so
# setting this reaches the bar and nothing else.
#
# Terminus is a BITMAP face: name a size it actually has — 12 14 16 18 20 22
# 24 28 32 — or fcft answers with the nearest strike it does have, and the bar
# lands a pixel away from everything measured against it. Empty falls back to
# chrome_font.
#
#panel_font = Terminus:pixelsize=20

# The gap between the bar and the screen edge, in pixels. 0 is the edge-to-edge
# taskbar. Non-zero floats it off all three sides, and the exclusive zone grows
# by the same amount — a maximized window stops at the gap instead of sliding
# underneath the bar. A bar that is hiding goes flush whatever this says, or
# the pointer could never reach the edge that brings it back.
#
#panel_margin = 0

# The bar's body opacity, in percent. Below 100 the panel's BACKGROUND is
# painted translucent and the desktop shows through it, while the text, the
# icons and the fills stay ink — a translucent glyph is a glyph nobody can
# read. Floored at 20: a bar at zero is not see-through, it is a row of
# invisible controls that still swallow the pointer.
#
#panel_opacity = 80

# The taskbar retreats to a one-row edge strip until the pointer reaches it.
# Off by default: a panel that is not there is a panel nobody finds again.
#panel_autohide = no

# `desktop_icons` is kdos-desk: ~/Desktop as a grid of cells on the background
# layer, with Home and Trash pinned last. Off leaves the wallpaper bare and
# gives the two rows of screen back.
#desktop_icons = yes

# PIXEL ICONS. On where there is artwork — the alien apps' own PNGs out of
# /usr/share/icons/hicolor, and the theme's own set out of the atlas
# kdos-icons ships, tinted into the accent at load. `no` makes every surface
# fall back to its glyph tier, which is also what a tty draws and what an
# install with no artwork gets; nothing on this desktop REQUIRES a picture.
#icons = yes

# The dockapp column (kdos-slit), from ~/.config/kdos/slit.conf — one gadget
# per line, `<interval_s> <width_cells> <command> [args…]`, exec'd directly
# with no shell anywhere. Off by default: a slit nobody configured is a column
# of dim `!` marks.
#slit = no

# All of the above are read ONCE, at startup, because each is a supervised
# child's command line. Changing one takes effect at the next login rather than
# on a reconfigure, and the reload SAYS SO rather than silently keeping the old
# value — a panel that appeared under the pointer half way through a session
# would be worse than one that waited.

# The font every piece of chrome is drawn in — the panels, the desktop icons and
# the notifications — as a fontconfig name. The default is the console's own
# cell, which is what makes the panel, the boot splash and tty1 look like one
# machine.
#
# It is a PIXEL size and libkwl does no HiDPI, so on a 4K panel the chrome comes
# out half the height it should be and this is the knob that says so:
# `Terminus:pixelsize=64` is the doubled cell. The compositor's own titlebars
# are the matching setting on the labwc side — <theme><font> in
# ~/.config/kdos-comp/rc.xml, in POINTS, where 24pt is 32px at 96dpi.
#
# Read once, at startup, like the two above.
#chrome_font = Terminus:pixelsize=32

# The top panel's clock, as a strftime format. The panel gets it on its
# command line (--clock), so like the chrome keys above it is read once, at
# startup. `%H:%M` is the default; `%a %d %H:%M` is the day-and-date shape.
#clock_format = %H:%M

# ── the CRT pass ─────────────────────────────────────────────────────────────
#
# The compositor renders the desktop through a phosphor shader: scanlines every
# third row, a horizontal bleed, a vignette, an optional tube curvature, and the
# faint glow a phosphor screen has even where nothing is drawn. It is the reason
# the boot splash, the TTY and the desktop finally look like one machine, and it
# is why the wallpaper no longer carries baked-in scanlines — two sets of them
# would beat against each other.
#
# All three are percentages. `crt = 0` is an honest OFF and the right answer if
# the fill rate is not there; the shader touches every pixel of every frame.
#
# It is forced off, whatever is written here, when the renderer is not GLES2 —
# `make run` with plain virtio-vga has only software rendering, and a fullscreen
# post-process on that is a slideshow rather than a look. The session log says
# so when it happens.
#
# One thing the pass costs: direct scanout is turned off while it is on. A
# fullscreen video can no longer be handed straight to the display controller,
# because a shader over the whole screen means the whole screen goes through the
# GPU. That is inherent, not an oversight.
#crt = 55

# The scanlines on their own — OFF by default, and the only part of the pass
# that is. They are a dark line on every third PHYSICAL row, and this desktop is
# a grid of 16x32 cells: the two periods share nothing, so text drawn crisp and
# two-colour arrives striped, and the finer the font the worse it reads. The
# bleed, the vignette and the phosphor floor are what carry the look; the
# scanlines are the part that fights the thing under them. 60 is the strength
# they shipped at, for anyone who wants them back.
#crt_scanlines = 0

# Tube curvature, off by default. It is the one effect that argues with a
# character grid, so it should be a decision rather than a surprise. Nothing is
# cropped at any value: the distortion is normalised so the corners still land
# on the corners.
#crt_curve = 0

# What the pass costs, so the decision is an informed one: a second swapchain
# per output (~100 MB of VRAM on a 4K screen), a full-frame shader run however
# small the damage, and — as above — fullscreen video loses direct scanout. On
# a battery that is the difference between a quiet GPU and a warm one, and
# `crt = 0` is the lever.

# Skip the pass on an output while the focused window is fullscreen on it: a
# film or a game gets the whole GPU back (direct scanout included) and the
# desktop keeps the phosphor. `off` is the skip; the default leaves even
# fullscreen behind the tube.
#crt_fullscreen = on

# ── idle ─────────────────────────────────────────────────────────────────────
#
# Seconds of no keyboard or pointer activity before each step; 0 means never.
# They are cumulative and each is measured from the LAST ACTIVITY, not from the
# step before it, so these three read as they look.
#
# Activity ends the dim and powers the outputs back on. It does NOT unlock —
# only a password does that.
#
# A client holding an idle inhibitor (a video player, for instance) stops all of
# this for as long as it holds one.
#
# IN A VIRTUAL MACHINE ALL THREE DEFAULT TO 0, whatever is written here as the
# default below, because a blanked screen over VNC is indistinguishable from a
# crashed compositor and that has already cost a debugging afternoon. Setting
# ANY of the three in this file overrides that — including setting one to 0,
# which is how you say you mean it.
#idle_dim  = 300
#idle_lock = 600
#idle_off  = 900

# ── the lid ──────────────────────────────────────────────────────────────────
#
# What closing the laptop lid does: off | lock | suspend. The default below is
# for hardware; IN A VIRTUAL MACHINE THE DEFAULT IS `off` (the same DMI gate as
# the idle timers — a VM's lid event is a stray ACPI report, not a decision),
# and writing the key here overrides that, exactly as the idle keys do.
#lid_close = suspend

# ── the other files in this directory ────────────────────────────────────────
#
# NONE OF THE THREE BELOW IS A comp.conf KEY. They are separate files beside
# this one, each read by a different program, and each SHIPS ABSENT because
# absent is a working default rather than an empty feature. They are documented
# here because this is the file people open when they go looking for the knobs.
#
#   ~/.config/kdos/favorites
#       The bottom panel's pinned launchers: one desktop-entry id per line
#       (`firefox-esr`, `org.xfce.mousepad`, `gimp` — upstream's own id, the
#       same name the taskbar matches by), `#` for a comment, first eight used.
#       An id with no entry installs nothing and is skipped. No file, no
#       favorites row and two more cells for the window list.
#
#   ~/.config/kdos/session-restore
#       Its EXISTENCE is the setting; the contents are ignored. With it,
#       kdos-desktop-start relaunches the alien apps that were running at the
#       last logout, two seconds apart, in the background — the list is
#       $XDG_STATE_HOME/kdos/session, written by kdos-session-save from the
#       menu's Log Out / Restart / Shut Down and from W-Escape. Opt-in because
#       an alien app costs a measured 18.3 s of container start and half a
#       dozen of them is a login that looks broken. Host programs are recorded
#       and never relaunched; where windows come BACK is window memory.
#           touch ~/.config/kdos/session-restore
#
#   ~/.config/kdos/slit.conf
#       kdos-slit, the gadget strip: each line is one gadget — how often it
#       runs, how many cells it gets, and the argv to run (never a shell).
#       `kdos-slit --help` prints the exact syntax. With no file kdos-slit
#       exits 0 and nothing is drawn.
