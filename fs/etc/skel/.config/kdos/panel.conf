# ---------------------------------
#   kdos-shell — the taskbar's own settings
# ---------------------------------
#
# Everything below is commented out and shows the DEFAULT. Uncomment a line to
# change it. This file is parsed, never sourced; a name it does not know is
# REPORTED to the session log rather than ignored, because a typo that produced
# silence is indistinguishable from a widget that does nothing.
#
# kdos-settings' Panel page writes these same keys and then SIGHUPs the panel,
# so a change made there takes effect on the bar that is on the screen. Editing
# this file by hand needs the same signal: `pkill -x -HUP kdos-shell`.
#
# The bar's SHAPE — which edge, how many cells thick, whether it hides — is the
# compositor's business and lives in ~/.config/kdos/comp.conf, because each of
# those is this program's command line.

# ── the notification area ────────────────────────────────────────────────────
#
# Left to right, and the layout runs the other way: the clock is last because
# it is the one thing on this bar that must never move. A name left out is a
# widget that does not exist at all.
#
#   clock battery volume net restart privacy tray pager mpris cpu
#   clipboard media notify stutter more
#
#right = pager tray more media privacy mpris clipboard cpu stutter restart net volume battery notify clock

# ── what lives behind the chevron ────────────────────────────────────────────
#
# HALF THE WING IS OCCASIONAL. The stutter chip, the restart mark and the
# clipboard depth appear when they have something to say and vanish when they
# do not — and each appearance is four columns, so the wing changes width, the
# charts beside it slide, and the bar reads as though it jerks.
#
# These names are the SAME names `right =` uses: a widget is either on the bar
# or behind the `more` chevron, which is TWO COLUMNS — a tray-shaped cell, with
# no gap of its own — and is drawn whether or not anything is in it. That is
# the whole point: nothing in the wing comes and goes. It costs exactly what
# hiding fcitx5's tray item gives back, so the wing is the width it always was.
# `overflow =` with nothing after it puts everything back on the bar.
#
#overflow = stutter restart clipboard

# StatusNotifierItem ids that are not drawn on the bar. They are listed in the
# chevron's popup instead.
#
# fcitx5 is here by default because it is the one item every KDOS session has
# and it cannot be clicked: it publishes `ItemIsMenu`, which means its Activate
# is "show my menu", and that menu is com.canonical.dbusmenu — a second
# protocol with a nested-variant layout tree that this tray does not render.
# The picture beside the clock therefore answered nothing at all. Empty this
# line to have it back.
#
#tray_hide = fcitx fcitx5 org.fcitx.fcitx5

# ── the charts on the second row ─────────────────────────────────────────────
#
# cpu ram disk net diskio. THE ORDER IS THE ORDER OF IMPORTANCE: a narrow bar
# drops them from the right. `meters =` with nothing after it is an honest off.
#
#meters = cpu ram net

# Whether a window button carries its name. `no` is the default and is what
# makes this a dock: a 40px bar gives a 40x40 button with a 32px picture in it,
# which is what a taskbar has looked like since Windows 7, and the name is what
# the tooltip is for. `auto` is the bar deciding for itself — full labels, then
# squeezed ones, then icon mode; `yes` keeps the label and lets the `+N` cell
# carry the overflow.
#
# THE PINNED LAUNCHERS AND THE WINDOW LIST ARE ONE ROW. A pinned application
# that is running occupies its pinned slot rather than appearing twice; the
# underline under a button is what says it is running at all.
#
#task_labels = no

# Whether the Start button carries the word as well as the mark. Off, because
# on an icons-only bar a lone word is the odd one out — Windows 7 dropped it
# for the same reason — and the seven cells are worth more to the window list.
#
#start_label = no
