# KDOS — what `kdos backup run` backs up, and where to.
#
# PARSED, NEVER SOURCED. One `key = value` per line, `#` to end of line a
# comment; `include` and `exclude` may repeat (eight of each) and everything
# else is last-one-wins. The paths become an argument vector, so a directory
# with a space in its name is one argument rather than two. An `exclude` is a
# restic pattern and is passed as written: `*.iso` excludes every ISO image.
#
# THE REPOSITORY IS NOT MADE FOR YOU. `restic -r <repo> init` asks for a
# password twice and writes it down nowhere; put that password in
# ~/.config/kdos/backup.pass at mode 0600 and nothing else in the file.
# `kdos backup run` refuses to run while that file is group or world readable.
#
# SNAPSHOTS ARE TAGGED `kdos`. Kup, the Backups page in System Settings, may
# use the same repository: its own pruning forgets only the snapshots it tagged
# `kup`, so neither ever removes the other's.
#
# COMMENTED OUT BECAUSE A BACKUP NOBODY ASKED FOR IS A SURPRISE, and the first
# run over a home directory can be hours. Uncomment, point `repo` somewhere
# with room, and run `kdos backup run` — or uncomment the nightly line in
# ~/.config/kdos/timers.d/10-backup.timer.

# repo    = /var/backup/kdos
# include = /home/kdos
# exclude = /home/kdos/.cache
# exclude = /home/kdos/.local/share/containers
