# KDOS — what Super+d searches, beyond the applications.
#
# PARSED, NEVER SOURCED. One `key = value` per line, `#` to end of line a
# comment.
#
# `files` ADDS THE FILE INDEX to the launcher: type three characters or more
# and any file whose name matches is listed under the applications, opened by
# its handler rather than executed.
#
# OFF BY DEFAULT, and the reason is not performance. A launcher that searched
# the disk unasked would put a person's filenames on screen the moment they
# pressed a key — in front of whoever is standing behind them, on a machine
# they may have opened to start a browser. Turning it on is a decision about
# who can see the screen, so it is theirs to make.
#
# It searches ~/.cache/kdos/plocate.db, which kdos-updatedb rebuilds nightly
# from $HOME only. Nothing can come back that you could not already list; the
# reasoning is in docs/kdos/03-architecture/security-model.md.

# files = yes
