# KDOS — the launcher's settings.
#
# PARSED, NEVER SOURCED. One `key = value` per line, `#` to end of line a
# comment.
#
# `files` IS WRITTEN BY THE CONTROL CENTRE AND READ BY NOTHING. kdos-settings
# sets it on its Desktop page, but kdos-launcher (Super+d) searches
# applications only, and kdos-palette lists files once three characters are
# typed whatever this file says. Setting it here changes no search.
#
# Neither surface reads ~/.cache/kdos/plocate.db: the palette runs `fd` over
# $HOME, and the index kdos-updatedb rebuilds nightly is used only by the
# `locate` command.

# files = yes
