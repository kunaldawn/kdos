#
# KDOS "PHOSPHOR" prompt.
#
# Box-drawing only — no Nerd Font glyphs. KDOS ships DejaVu and Terminus, and
# a prompt full of tofu is worse than a prompt with no icons.
#
# Colours come from the palette block at the bottom of this file, which
# `kdos theme` regenerates from the active scheme. Note the
# template's naming: `blue` is always the accent colour, so it is phosphor
# green under KDOS-Phosphor and amber under KDOS-Amber. Style everything that
# should follow the accent with `blue`.

palette = "kdos"

format = """
[┌─](subtext0)$username$hostname$container$directory$git_branch$git_status$cmd_duration$status
[└─](subtext0)$character"""

add_newline = false
command_timeout = 800

[username]
show_always = true
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "subtext1"
format = "[@$hostname]($style)[ ─ ](subtext0)"

# distrobox / podman. Alien apps run in a glibc box with the same $HOME, so
# knowing which side of the boundary a shell is on matters more here than on a
# normal distro.
[container]
style = "bold yellow"
format = "[\\[$name\\]]($style)[ ─ ](subtext0)"

[directory]
style = "bold green"
truncation_length = 4
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style)"
read_only = " [ro]"
read_only_style = "red"

[git_branch]
style = "magenta"
format = "[ ─ ](subtext0)[$branch]($style)"

[git_status]
style = "red"
format = "[($all_status$ahead_behind)]($style)"
conflicted = "!"
ahead = " +$count"
behind = " -$count"
diverged = " +$ahead_count-$behind_count"
untracked = " ?$count"
stashed = " $$count"
modified = " *$count"
staged = " ~$count"
renamed = " >$count"
deleted = " x$count"

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[ ─ $duration]($style)"

[status]
disabled = false
style = "bold red"
format = "[ ─ exit:$status]($style)"

[character]
success_symbol = "[λ](bold blue)"
error_symbol = "[λ](bold red)"
vimcmd_symbol = "[:](bold green)"

# Language / toolchain modules. KDOS ships rust, go, node, python and clang, so
# these are real signals rather than decoration.
[rust]
symbol = "rs "
style = "red"
format = "[ ─ $symbol$version]($style)"

[golang]
symbol = "go "
style = "cyan"
format = "[ ─ $symbol$version]($style)"

[nodejs]
symbol = "node "
style = "green"
format = "[ ─ $symbol$version]($style)"

[python]
symbol = "py "
style = "yellow"
format = "[ ─ $symbol$version]($style)"

[c]
symbol = "c "
style = "blue"
format = "[ ─ $symbol$version]($style)"

# Noise on a distro whose whole point is one machine, one shell.
[package]
disabled = true

[line_break]
disabled = true

