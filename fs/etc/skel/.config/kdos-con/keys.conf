# kdos-con — the chords.
#
# THE SAME CHORDS rc.xml BINDS. The graphical desktop reads labwc's XML and
# this desktop reads no XML at all, so the defaults are written twice in two
# syntaxes — but they are the same defaults, because a person who learns
# Super+Return on one must not have to unlearn it on the other. Changing one
# here changes ~/.config/kdos-comp/rc.xml too.
#
# One `chord = action` per line. A line names an action ONCE: the last line to
# name an action wins, and an action no line names keeps its default, so
# rebinding one key does not mean restating the rest.
#
# Modifiers are Super, Shift, Alt and Ctrl, joined with `+`. Super is the
# desktop's own — a chord without it belongs to whatever program has the focus,
# and the two Alt+Tab lines are the exception a lifetime of muscle memory has
# earned.
#
# THE LEADER IS HOW THE CHORDS ARE REACHED WHERE SUPER IS NOT. A terminal that
# does not implement the kitty keyboard protocol reports no Super at all, and
# the Linux VT a `--tty` view runs in is one of them — so every Super chord
# above would be unreachable. The leader followed by a chord's own key runs
# that chord: Ctrl+A then Return opens a terminal, Ctrl+A then Space the Start
# menu. Pressing it twice sends the literal to the focused window, so the key
# it occupies is not taken away.
#
# Applies at the next session start.
#
# Ctrl+Alt+F1..F12 are NOT here and cannot be bound here. They switch virtual
# terminals, the display acts on them before the session ever sees them, and
# they are what reaches the tty2 recovery console while the desktop holds the
# screen — a chord that could be rebound away is a machine that can be locked
# out of its own console.

# The leader. Rebind it here like any other chord; it is the one entry that is
# not on Super, and it cannot be, because it exists for the views where Super
# never arrives.
Ctrl+a          = leader

# Windows
Super+Return    = terminal
Super+q         = close
Super+m         = maximise
Super+f         = fullscreen
Super+n         = minimise
Super+Shift+n   = restore

# The scratchpad: one window the session keeps over everything, on whatever
# workspace you are looking at. The first press opens the terminal named by
# con.conf's `terminal` key and marks it; after that the same key shows and
# hides it. The second chord hands the role to the focused window, and the one
# that had it comes back as an ordinary window here.
Super+grave     = scratchpad
Super+Alt+grave = scratchpad-mark

# The stack. Super+Tab is what rc.xml binds; Alt+Tab is what hands do.
Super+Tab       = next
Super+Shift+Tab = prev
Alt+Tab         = next-alt
Alt+Shift+Tab   = prev-alt

# Tiling. Repeating one combines with the last, so Super+Left then Super+Up is
# the top-left quarter — the compositor's behaviour, because it is the
# compositor's code.
Super+Left      = snap-left
Super+Right     = snap-right
Super+Up        = snap-up
Super+Down      = snap-down

# Reaching a window by pointing at it, and moving one there. Super+Alt+arrow
# moves the focused window on both desktops; Super+Shift+arrow is unbound on
# the compositor, which has no directional focus of its own.
Super+Shift+Left  = focus-left
Super+Shift+Right = focus-right
Super+Shift+Up    = focus-up
Super+Shift+Down  = focus-down
Super+Alt+Left    = swap-left
Super+Alt+Right   = swap-right
Super+Alt+Up      = swap-up
Super+Alt+Down    = swap-down

# Past the empty ones: Super+1..9 reaches a workspace by number and these
# reach the next one somebody is using.
Super+PageUp      = workspace-prev
Super+PageDown    = workspace-next

# The keyboard's own window management: every one of these was a menu item on
# the text desks this desktop descends from. Super+Alt+1..9 raises the window
# whose number the title bar and the taskbar row draw, and is not listed here
# for the same reason the workspace digits are not.
Super+Shift+t     = tile
Super+F8          = tile-fkey
Super+Alt+t       = cascade
Super+r           = rearrange
Super+F9          = rearrange-fkey
Super+Shift+d     = show-desktop
Super+F2          = windows

# Mark and transfer. The session holds the literal text of every cell on the
# screen, so a mark is a read of what is already there — it works over a
# terminal, a surface and an embedded application alike, and it needs nothing
# from the program being marked.
Super+Shift+m     = mark
Super+Shift+v     = paste

# A capture is a mark that also files a picture: the same rubber band, the
# text on the clipboard, and the rectangle photographed into
# ~/Pictures/Screenshots by whatever con.conf's `capture` names.
Super+Shift+p     = capture
# The whole capture group, for the verbs that have no chord of their own.
Super+Ctrl+c      = capture-menu

# AND THE KEY THE KEYBOARD ALREADY HAS. Print is the whole screen, its shifted
# form is the same rectangle drag `capture` is, and its Alt form starts the
# screen recording — and stops it, because there is one screen and one portal
# session, so a second recording is not a thing to want.
#
# THESE REACH A KMS VIEW AND NOTHING ELSE, like the media keys below: Print
# produces no character, so no terminal reports one. The Super chords above are
# the way to the same three verbs over ssh and in a `--tty` view.
Print             = capture-screen
Shift+Print       = capture-print
Alt+Print         = capture-record

# The two questions a bar answers by being on the screen — and this desktop
# puts the bar away, so they get chords. Three modifiers because neither is
# pressed often enough to earn a shorter one.
Super+Ctrl+Alt+t  = time
Super+Ctrl+Alt+b  = battery

# Remind me. The plain chord opens a one-row prompt and the line is what you
# would have typed at a shell — `in 20m tea`, `at 15:30 call back`,
# `tomorrow 9 stand-up`. The reminder is a job in ~/.config/kdos/timers.d, so
# it survives a logout; it is delivered ONCE and then it is gone.
#
# Listing and clearing take a modifier more, so a hand reaching for the prompt
# cannot forget the lot.
Super+Ctrl+r      = remind
Super+Ctrl+Alt+r  = remind-ls
Super+Ctrl+Shift+r = remind-clear

# The notices already on the screen, on one letter. A toast interrupts, so the
# chord that puts one away is the cheapest on the keyboard and the three that
# do more to them are its modified forms. `Super+Alt+x` is the undo for
# `Super+x` pressed a moment too early; it comes back without its buttons,
# because the notification it came from is closed and its actions belong to the
# program that sent it. The centre itself is the Start menu's Notifications row
# and needs no chord.
Super+x           = dismiss
Super+Shift+x     = dismiss-all
Super+Ctrl+x      = dnd
Super+Alt+x       = undismiss

# Never lock or blank on idle — and again to let it. Named for the file it
# sets: one switch in one place, and a chord called after its inverse would be
# a chord nobody could be sure of the direction of.
Super+Ctrl+i      = stay-awake

# The bar, away and back. The work area is taken from the row it occupies, so
# every window re-fits the moment it goes — and a docked shell panel goes with
# it, because a chord that hid one bar and left the other would mean two
# different things on two machines. It is session state: a bar hidden on a
# machine you walked away from comes back with the next login.
Super+Shift+space = taskbar

# Warm the palette, and again to cool it. NOT on `Super+Ctrl+n`, which this
# desktop has given the scratch pad since it had accessories — a chord a person
# already knows here is worth more than one that matches another desktop's
# defaults.
Super+Ctrl+Shift+n = night-light

# A script is the keys somebody typed, played back. `learn` starts recording
# what reaches the focused window and the same chord stops it and asks for a
# letter to keep it under; `play` then that letter types it into whatever has
# the focus now, at the rate it was typed at.
#
# THERE IS NO FIELD IN A SCRIPT THAT COULD NAME A PROGRAM. A script is keys
# into a window and never a command, so a file somebody plants under
# ~/.config/kdos-con/scripts types into a window and cannot start anything.
# Nothing is recorded or played while the screen is locked.
Super+Shift+r     = learn
Super+Alt+r       = play

# The accent picker: each scheme drawn in its own colours, the desktop
# repainting live as the highlight moves, Enter to keep and Escape to put back
# the one you started on. Space with three modifiers on purpose — a chord that
# retints the whole screen must be hard to press by accident.
Super+Ctrl+Shift+space = theme

# The console desktop's ground: a picture made of characters, cycled in place.
# Beside the accent chord and one modifier lighter, because it is the same
# question asked about the ground. `none` is in the ring, so the chord can undo
# itself.
Super+Ctrl+space  = background

# The screen's font, one step at a time. `equal` and `minus` are rc.xml's own
# spellings, so a chord reads the same in both files. Plus is not bound and
# cannot be: `+` is what a chord is split on, and it is a shifted equals on
# every layout this desktop ships in any case.
#
# THEY REACH A SCREEN AND NOT A TERMINAL. A view running inside somebody
# else's terminal says so when it attaches, and the session answers that the
# terminal owns the font rather than sending a step nothing can act on.
Super+equal       = font-up
Super+minus       = font-down
Super+Ctrl+0      = font-reset

# The media keys, on no modifier because that is where a keyboard puts them.
# They arrive through libkkms and through nothing else, so these lines do
# nothing on a view that reads a terminal — a media key produces no character
# and no terminal has one to report.
XF86AudioRaiseVolume = volume-up
XF86AudioLowerVolume = volume-down
XF86AudioMute        = volume-mute
XF86AudioPlay        = media-play
XF86AudioStop        = media-stop
XF86AudioNext        = media-next
XF86AudioPrev        = media-prev

# What the chords start. WHICH program each one is belongs to con.conf.
# ONE SEARCH OVER EVERYTHING, on the chord a keyboard reaches for. A keyboard
# wants to type a name and a pointer wants to read rows, so Super+space is the
# palette and the taskbar's Start button is the menu. Super+F10 still opens the
# menu from the keyboard for anyone who wants the list.
Super+space     = palette
Super+F10       = menu-fkey
Super+d         = launcher
Super+F7        = launcher-fkey
Super+l         = lock
Super+Shift+l   = saver

# The surfaces, on the chords rc.xml already binds them to on the graphical
# desktop. A chord a person already knows is worth more than one that is
# locally tidy, and it means there is one key card rather than two.
Super+F1        = keys
Super+F3        = audio
Super+F4        = net
Super+F5        = bluetooth
Super+F6        = devices
Super+i         = settings
Super+c         = calendar
Super+slash     = docs
Super+p         = displays

# AND ALL OF THEM, IN ONE LIST. The eleven above are the ones worth a key; the
# printers, the users and the clock are not, and a chord each would be eleven
# more keys to learn. This opens the palette already reading `setup`, which is
# the group every panel is filed under — the capture group's neighbour, on the
# shape `Super+Ctrl+c` already has.
Super+Ctrl+h    = setup-menu

# The two that had no chord on either desktop. A power page and a system
# monitor are what a person reaches for while something is going wrong.
Super+Ctrl+p    = power
Super+Ctrl+t    = monitor

# The desk accessories. Summoned over whatever is on the screen and dismissed
# leaving it untouched — which is what an overlay already is on this desktop.
Super+Ctrl+q    = calculator
Super+Ctrl+n    = notes
Super+Ctrl+v    = clipboard
Super+Ctrl+e    = characters
# `b` for the address BOOK. Not `a`: `Ctrl+a` is the leader and pressing it
# twice sends the literal, so `Super+Ctrl+a` would be the one chord in this
# family the leader could never reach.
Super+Ctrl+b    = contacts

# Find, and Shift because Super+f is fullscreen on both desktops and a search
# that was one slip from covering the screen would be the wrong trade.
Super+Shift+f   = find

# ONE KEY PER PROGRAM: the chord raises the window running it, or starts it,
# and pressing it again while that window has the focus cycles to the next
# window of the same program.
#
# THE CHORD NAMES A ROLE AND con.conf NAMES THE PROGRAM. `files` is the file
# manager whatever this machine's file manager is; rebinding the key here does
# not change which program it opens, and changing the program there does not
# move the key. `Super+e` is the chord rc.xml already gives a file manager and
# the other six are its shifted neighbours, so the set is one hand position.
#
# `calendar`, `find` and `notes` name surfaces of this desktop's own, which is
# why the diary is `agenda`.
Super+e         = files
Super+Shift+e   = mail
Super+Shift+b   = browser
Super+Shift+u   = music
Super+Shift+c   = agenda
Super+Shift+g   = chat
Super+Shift+w   = writing

# The session itself. Shift, so that the chord which closes a window and the
# chord which ends the desktop are not one slip apart.
Super+Shift+q   = quit

# Workspaces are not listed: Super+1..9 switches and Super+Shift+1..9 sends the
# focused window. Nine digits and nine shifted digits would be eighteen lines
# saying one thing.
