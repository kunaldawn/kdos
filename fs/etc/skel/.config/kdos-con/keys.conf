# kdos-con — the chords.
#
# THE SAME CHORDS rc.xml BINDS. The graphical desktop reads labwc's XML and
# this desktop reads no XML at all, so the defaults are written twice in two
# syntaxes — but they are the same defaults, because a person who learns
# Super+Return on one must not have to unlearn it on the other. Changing one
# here changes ~/.config/kdos-comp/rc.xml too.
#
# One `chord = action` per line. A line names an action ONCE: the last line to
# name an action wins, and an action no line names keeps its default, so
# rebinding one key does not mean restating the rest.
#
# Modifiers are Super, Shift, Alt and Ctrl, joined with `+`. Super is the
# desktop's own — a chord without it belongs to whatever program has the focus,
# and the two Alt+Tab lines are the exception a lifetime of muscle memory has
# earned.
#
# THE LEADER IS HOW THE CHORDS ARE REACHED WHERE SUPER IS NOT. A terminal that
# does not implement the kitty keyboard protocol reports no Super at all, and
# the Linux VT a `--tty` view runs in is one of them — so every Super chord
# above would be unreachable. The leader followed by a chord's own key runs
# that chord: Ctrl+A then Return opens a terminal, Ctrl+A then Space the Start
# menu. Pressing it twice sends the literal to the focused window, so the key
# it occupies is not taken away.
#
# Applies at the next session start.
#
# Ctrl+Alt+F1..F12 are NOT here and cannot be bound here. They switch virtual
# terminals, the display acts on them before the session ever sees them, and
# they are what reaches the tty2 recovery console while the desktop holds the
# screen — a chord that could be rebound away is a machine that can be locked
# out of its own console.

# The leader. Rebind it here like any other chord; it is the one entry that is
# not on Super, and it cannot be, because it exists for the views where Super
# never arrives.
Ctrl+a          = leader

# Windows
Super+Return    = terminal
Super+q         = close
Super+m         = maximise
Super+f         = fullscreen
Super+n         = minimise
Super+Shift+n   = restore

# The stack. Super+Tab is what rc.xml binds; Alt+Tab is what hands do.
Super+Tab       = next
Super+Shift+Tab = prev
Alt+Tab         = next-alt
Alt+Shift+Tab   = prev-alt

# Tiling. Repeating one combines with the last, so Super+Left then Super+Up is
# the top-left quarter — the compositor's behaviour, because it is the
# compositor's code.
Super+Left      = snap-left
Super+Right     = snap-right
Super+Up        = snap-up
Super+Down      = snap-down

# Reaching a window by pointing at it, and moving one there. Super+Alt+arrow
# moves the focused window on both desktops; Super+Shift+arrow is unbound on
# the compositor, which has no directional focus of its own.
Super+Shift+Left  = focus-left
Super+Shift+Right = focus-right
Super+Shift+Up    = focus-up
Super+Shift+Down  = focus-down
Super+Alt+Left    = swap-left
Super+Alt+Right   = swap-right
Super+Alt+Up      = swap-up
Super+Alt+Down    = swap-down

# Past the empty ones: Super+1..9 reaches a workspace by number and these
# reach the next one somebody is using.
Super+PageUp      = workspace-prev
Super+PageDown    = workspace-next

# What the chords start. WHICH program each one is belongs to con.conf.
Super+space     = menu
Super+d         = launcher
Super+l         = lock
Super+Shift+l   = saver

# The session itself. Shift, so that the chord which closes a window and the
# chord which ends the desktop are not one slip apart.
Super+Shift+q   = quit

# Workspaces are not listed: Super+1..9 switches and Super+Shift+1..9 sends the
# focused window. Nine digits and nine shifted digits would be eighteen lines
# saying one thing.
