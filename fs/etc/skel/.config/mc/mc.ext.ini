# ██║ ██╔╝██╔══██╗██╔═══██╗██╔════╝
# █████╔╝ ██║  ██║██║   ██║███████╗
# ██╔═██╗ ██║  ██║██║   ██║╚════██║
# ██║  ██╗██████╔╝╚██████╔╝███████║
# ╚═╝  ╚═╝╚═════╝  ╚═════╝ ╚══════╝
# ---------------------------------
#   What Enter does on a file in mc.
#
# ONE TABLE, NOT TWO. Everything that is not an archive falls to the catch-all
# group at the end, which hands the file to `kdos-appbox open` — the same
# resolution `xdg-open`, the desktop's icons and the file chooser use, over
# mimeapps.list and the desktop entries. mc keeping its own answer would mean
# changing the default PDF viewer left mc opening the old one.
#
# THE ARCHIVE ROWS STAY, and only the ones that WORK. `%cd %p/utar://` mounts
# an archive as a DIRECTORY inside the panel, which is a view no MIME type
# expresses: there is no type meaning "browse the inside of this".
#
# A ROW WHOSE VFS HELPER IS NOT ON THIS IMAGE IS WORSE THAN NO ROW: Enter on a
# `.rar` would open an empty panel instead of reaching a handler that can
# extract it. Kept are mc's built-in `utar` and `ucpio`, and the extfs helpers
# whose backing program ships — `uzip`, `uar`, `ulib`, `patchfs`, `mailfs`,
# `torrent`. Dropped are the rows for 7z, rar, arj, cab, lha, alz, ace, arc,
# zoo, wim, unar, c1541, iso9660, rpm and deb, none of whose programs are here;
# those types fall through and reach `kdos-openarchive`.
#
# THIS FILE REPLACES THE SYSTEM ONE WHOLESALE. mc reads
# ~/.config/mc/mc.ext.ini INSTEAD of /etc/mc/mc.ext.ini and does not merge the
# two, so anything left out stops working with no message — which is why the
# live archive rows are carried here rather than referenced, including the ones
# that hold no Open= of their own and reach one through Include=.
#
# `Open=` IS RUN AS A SHELL SCRIPT AND mc WAITS FOR IT, so the handler is
# backgrounded or the panel freezes for as long as the program it opened lives.
# That is mc's own idiom; its shipped helpers background the same way.
#
# The version group comes first or mc reports an error and falls back to the
# system file; the Include groups and the catch-all come last, because sections
# are matched in file order and the first match wins.
# ---------------------------------

[mc.ext.ini]
Version=4.0

[gitfs changeset]
Regex=^\\[git\\]
Open=%cd %p/changesetfs://
View=%cd %p/patchsetfs://

# Since we use "file -z", we should use Regex and Shell first, then Type.

# .tgz, .tpz, .tar.gz, .tar.z, .tar.Z

[tar.gzip]
Regex=\\.t([gp]?z|ar\\.g?[zZ])$
Include=tar.gz

[gem]
Shell=.gem
Include=tar.gz

[crate]
Shell=.crate
Include=tar.gz

[tar.bzip2]
Regex=\\.t(ar\\.bz2|bz2?|b2)$
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.bzip2

# .tar.lzma, .tlz

[tar.lzma]
Regex=\\.t(ar\\.lzma|lz)$
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.lzma

[tar.lz]
Shell=.tar.lz
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.lz

# .tar.lz4, .tlz4

[tar.lz4]
Regex=\\.t(ar\\.lz4|lz4)$
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.lz4

# .tar.lzo, .tzo

[tar.lzo]
Regex=\\.t(ar\\.lzo|zo)$
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.lzo

# .tar.xz, .txz

[tar.xz]
Regex=\\.t(ar\\.xz|xz)$
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.xz

# .tar.zst, .tzst

[tar.zst]
Regex=\\.t(ar\\.zst|zst)$
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.zst

# .tar.F - used on QNX

[tar.qpr]
Regex=\\.qp[rk]$
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.qpr

[tar]
Shell=.tar
ShellIgnoreCase=true
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar

[cpio.Z]
Shell=.cpio.Z
Open=%cd %p/ucpio://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cpio.z

[cpio.lz]
Shell=.cpio.lz
Open=%cd %p/ucpio://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cpio.lz

[cpio.lz4]
Shell=.cpio.lz4
Open=%cd %p/ucpio://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cpio.lz4

[cpio.lzo]
Shell=.cpio.lzo
Open=%cd %p/ucpio://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cpio.lzo

[cpio.xz]
Shell=.cpio.xz
Open=%cd %p/ucpio://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cpio.xz

[cpio.zst]
Shell=.cpio.zst
Open=%cd %p/ucpio://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cpio.zst

[cpio.gz]
Shell=.cpio.gz
Open=%cd %p/ucpio://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cpio.gz

[cpio]
Shell=.cpio
ShellIgnoreCase=true
Include=cpio

[initrd]
Regex=^(initramfs.*\\.img|initrd(-.+)?\\.img(-.+)?)$
Include=cpio

[patch]
Regex=\\.(diff|patch)$
Open=%cd %p/patchfs://
View=%view{ascii} /usr/libexec/mc/ext.d/misc.sh view cat

[patch.gz]
Regex=\\.(diff|patch)\\.(gz|Z)$
Open=%cd %p/patchfs://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view gz

[patch.bz2]
Regex=\\.(diff|patch)\\.bz2$
Open=%cd %p/patchfs://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view bz2

[patch.xz]
Regex=\\.(diff|patch)\\.xz$
Open=%cd %p/patchfs://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view xz

[patch.zst]
Regex=\\.(diff|patch)\\.zst$
Open=%cd %p/patchfs://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view zst

[ar]
Regex=\\.s?a$
Open=%cd %p/uar://
#Open=%view{ascii} ar tv %f
View=%view{ascii} /usr/libexec/mc/ext.d/misc.sh view ar

[gplib]
Shell=.lib
ShellIgnoreCase=true
Open=%cd %p/ulib://
View=%view{ascii} /usr/libexec/mc/ext.d/misc.sh view lib

[torrent]
Shell=.torrent
ShellIgnoreCase=true
Open=%cd %p/torrent://
View=%view{ascii} /usr/libexec/mc/ext.d/misc.sh view torrent

[zip-by-shell]
Shell=.zip
ShellIgnoreCase=true
Open=%cd %p/uzip://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view zip

[mailbox]
Type=^ASCII mail text
Open=%cd %p/mailfs://

[ipk-openwrt]
Shell=.ipk
Type=\\(gzip compressed
Include=tar.gz

# Object

[zip-by-type]
Type=\\(Zip archive
Open=%cd %p/uzip://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view zip

[jar]
Type=\\(Java (Jar file|archive) data \\((zip|JAR)\\)\\)
TypeIgnoreCase=true
Open=%cd %p/uzip://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view zip

[Include/cpio]
Open=%cd %p/ucpio://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cpio

[Include/tar.gz]
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.gz

[Default]
Open=(kdos-appbox open %f &)
View=
