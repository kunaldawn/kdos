# █████╔╝ ██║  ██║██║   ██║███████╗
# ██╔═██╗ ██║  ██║██║   ██║╚════██║
# ██║  ██╗██████╔╝╚██████╔╝███████║
# ╚═╝  ╚═╝╚═════╝  ╚═════╝ ╚══════╝
# ---------------------------------
#   What Enter does on a file in mc.
#
# ONE TABLE, NOT TWO. Everything that is not an archive falls to [Default],
# which hands the file to `kdos-appbox open` — the same resolution `xdg-open`,
# the desktop's icons and the file chooser use, over mimeapps.list and the
# desktop entries. mc keeping its own answer would mean changing the default
# PDF viewer left mc opening the old one.
#
# THE ARCHIVE ROWS STAY, and they are the only rows kept. `%cd %p/utar://`
# mounts an archive as a DIRECTORY inside the panel, which is a view no MIME
# type expresses: there is no type meaning "browse the inside of this". They
# are copied from /etc/mc/mc.ext.ini unchanged, including the sections that
# carry no Open= of their own and reach one through Include=.
#
# THIS FILE REPLACES THE SYSTEM ONE WHOLESALE. mc reads
# ~/.config/mc/mc.ext.ini INSTEAD of /etc/mc/mc.ext.ini and does not merge the
# two, so anything left out stops working with no message — which is why the
# archive rows are carried here rather than referenced.
#
# `Open=` IS RUN AS A SHELL SCRIPT AND mc WAITS FOR IT, so the handler is
# backgrounded or the panel freezes for as long as the program it opened
# lives. That is mc's own idiom; its shipped helpers background the same way.
#
# `[mc.ext.ini]` with Version=4.0 comes first or mc reports an error and falls
# back to the system file; the `[Include/*]` blocks and `[Default]` come last,
# because sections are matched in file order and the first match wins.
# ---------------------------------

[mc.ext.ini]
Version=4.0

[gitfs changeset]
Regex=^\\[git\\]
Open=%cd %p/changesetfs://
View=%cd %p/patchsetfs://

# Since we use "file -z", we should use Regex and Shell first, then Type.

# .tgz, .tpz, .tar.gz, .tar.z, .tar.Z

[tar.gzip]
Regex=\\.t([gp]?z|ar\\.g?[zZ])$
Include=tar.gz

[gem]
Shell=.gem
Include=tar.gz

[crate]
Shell=.crate
Include=tar.gz

[tar.bzip2]
Regex=\\.t(ar\\.bz2|bz2?|b2)$
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.bzip2

# .tar.lzma, .tlz

[tar.lzma]
Regex=\\.t(ar\\.lzma|lz)$
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.lzma

[tar.lz]
Shell=.tar.lz
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.lz

# .tar.lz4, .tlz4

[tar.lz4]
Regex=\\.t(ar\\.lz4|lz4)$
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.lz4

# .tar.lzo, .tzo

[tar.lzo]
Regex=\\.t(ar\\.lzo|zo)$
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.lzo

# .tar.xz, .txz

[tar.xz]
Regex=\\.t(ar\\.xz|xz)$
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.xz

# .tar.zst, .tzst

[tar.zst]
Regex=\\.t(ar\\.zst|zst)$
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.zst

# .tar.F - used on QNX

[tar.qpr]
Regex=\\.qp[rk]$
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.qpr

[tar]
Shell=.tar
ShellIgnoreCase=true
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar

[arj]
Regex=\\.a(rj|[0-9][0-9])$
RegexIgnoreCase=true
Open=%cd %p/uarj://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view arj

[cab]
Shell=.cab
ShellIgnoreCase=true
Open=%cd %p/ucab://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cab

[ha]
Shell=.ha
ShellIgnoreCase=true
Open=%cd %p/uha://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view ha

[rar]
Regex=\\.r(ar|[0-9][0-9])$
RegexIgnoreCase=true
Open=%cd %p/urar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view rar

# ALZip

[alz]
Shell=.alz
ShellIgnoreCase=true
Open=%cd %p/ualz://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view alz

[cpio.Z]
Shell=.cpio.Z
Open=%cd %p/ucpio://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cpio.z

[cpio.lz]
Shell=.cpio.lz
Open=%cd %p/ucpio://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cpio.lz

[cpio.lz4]
Shell=.cpio.lz4
Open=%cd %p/ucpio://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cpio.lz4

[cpio.lzo]
Shell=.cpio.lzo
Open=%cd %p/ucpio://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cpio.lzo

[cpio.xz]
Shell=.cpio.xz
Open=%cd %p/ucpio://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cpio.xz

[cpio.zst]
Shell=.cpio.zst
Open=%cd %p/ucpio://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cpio.zst

[cpio.gz]
Shell=.cpio.gz
Open=%cd %p/ucpio://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cpio.gz

[cpio]
Shell=.cpio
ShellIgnoreCase=true
Include=cpio

[initrd]
Regex=^(initramfs.*\\.img|initrd(-.+)?\\.img(-.+)?)$
Include=cpio

[7zip]
Shell=.7z
ShellIgnoreCase=true
Open=%cd %p/u7z://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view 7z

[patch]
Regex=\\.(diff|patch)$
Open=%cd %p/patchfs://
View=%view{ascii} /usr/libexec/mc/ext.d/misc.sh view cat

[patch.gz]
Regex=\\.(diff|patch)\\.(gz|Z)$
Open=%cd %p/patchfs://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view gz

[patch.bz2]
Regex=\\.(diff|patch)\\.bz2$
Open=%cd %p/patchfs://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view bz2

[patch.xz]
Regex=\\.(diff|patch)\\.xz$
Open=%cd %p/patchfs://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view xz

[patch.zst]
Regex=\\.(diff|patch)\\.zst$
Open=%cd %p/patchfs://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view zst

[ls-lR]
Regex=(^|\\.)ls-?lR(\\.gz|Z|bz2)$
Open=%cd %p/lslR://

[trpm]
Shell=.trpm
Open=%cd %p/trpm://
View=%view{ascii} /usr/libexec/mc/ext.d/package.sh view trpm

# RPM packages (SuSE uses *.spm for source packages)

[src.rpm]
Regex=\\.(src\\.rpm|spm)$
Open=%cd %p/rpm://
View=%view{ascii} /usr/libexec/mc/ext.d/package.sh view src.rpm

[rpm]
Shell=.rpm
Open=%cd %p/rpm://
View=%view{ascii} /usr/libexec/mc/ext.d/package.sh view rpm

[deb]
Regex=\\.u?deb$
Open=%cd %p/deb://
View=%view{ascii} /usr/libexec/mc/ext.d/package.sh view deb

[dpkg]
Shell=.debd
Open=%cd %p/debd://
View=%view{ascii} /usr/libexec/mc/ext.d/package.sh view debd

[apt]
Shell=.deba
Open=%cd %p/deba://
View=%view{ascii} /usr/libexec/mc/ext.d/package.sh view deba

[ISO9660]
Shell=.iso
ShellIgnoreCase=true
Open=%cd %p/iso9660://
View=%view{ascii} /usr/libexec/mc/ext.d/misc.sh view iso9660

[ar]
Regex=\\.s?a$
Open=%cd %p/uar://
#Open=%view{ascii} ar tv %f
View=%view{ascii} /usr/libexec/mc/ext.d/misc.sh view ar

[gplib]
Shell=.lib
ShellIgnoreCase=true
Open=%cd %p/ulib://
View=%view{ascii} /usr/libexec/mc/ext.d/misc.sh view lib

[d64]
Shell=.d64
ShellIgnoreCase=true
Open=%cd %p/uc1541://
View=%view{ascii} c1541 %f -list

# Glade, a user interface designer for GTK+ and GNOME

[torrent]
Shell=.torrent
ShellIgnoreCase=true
Open=%cd %p/torrent://
View=%view{ascii} /usr/libexec/mc/ext.d/misc.sh view torrent

[ace]
Shell=.ace
ShellIgnoreCase=true
Open=%cd %p/uace://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view ace

[arc]
Shell=.arc
ShellIgnoreCase=true
Open=%cd %p/uarc://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view arc

[zip-by-shell]
Shell=.zip
ShellIgnoreCase=true
Open=%cd %p/uzip://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view zip

[zoo]
Shell=.zoo
ShellIgnoreCase=true
Open=%cd %p/uzoo://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view zoo

[wim]
Shell=.wim
ShellIgnoreCase=true
Open=%cd %p/uwim://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view wim

[mailbox]
Type=^ASCII mail text
Open=%cd %p/mailfs://

[ipk-deb]
Shell=.ipk
Type=^Debian binary package
Open=%cd %p/deb://
View=%view{ascii} /usr/libexec/mc/ext.d/package.sh view deb

[ipk-openwrt]
Shell=.ipk
Type=\\(gzip compressed
Include=tar.gz

# Object

[zip-by-type]
Type=\\(Zip archive
Open=%cd %p/uzip://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view zip

[jar]
Type=\\(Java (Jar file|archive) data \\((zip|JAR)\\)\\)
TypeIgnoreCase=true
Open=%cd %p/uzip://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view zip

[lha]
Type=^LHa .*archive
Open=%cd %p/ulha://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view lha

[pak]
Type=^PAK .*archive
Open=%cd %p/unar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view pak

# Parity Archive

[Include/cpio]
Open=%cd %p/ucpio://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view cpio

[Include/tar.gz]
Open=%cd %p/utar://
View=%view{ascii} /usr/libexec/mc/ext.d/archive.sh view tar.gz

[Default]
Open=(kdos-appbox open %f &)
View=
