# KDOS "PHOSPHOR" for tmux. Square, green, no powerline glyphs — DejaVu and
# Terminus have no Nerd Font shapes and half-drawn separators look broken.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",foot*:Tc,xterm-256color:Tc"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S · #W"

# Ctrl-a, because Ctrl-b fights readline word movement.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel

# ── Phosphor ─────────────────────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#000a03,fg=#b8ffc8"

set -g status-left-length 40
set -g status-left "#[bg=#39ff14,fg=#000a03,bold] #S #[bg=#000a03,fg=#39ff14] "

set -g status-right-length 80
set -g status-right "#[fg=#12401f]|#[fg=#7ddb96] #(uptime | sed 's/.*load average: //') #[fg=#12401f]|#[fg=#ffb000] %Y-%m-%d #[fg=#39ff14]%H:%M "

setw -g window-status-format "#[fg=#7ddb96] #I:#W#{?window_zoomed_flag,+,} "
setw -g window-status-current-format "#[bg=#12401f,fg=#39ff14,bold] #I:#W#{?window_zoomed_flag,+,} "
setw -g window-status-activity-style "fg=#ffb000"
setw -g window-status-bell-style "fg=#ff3131"

set -g pane-border-style "fg=#12401f"
set -g pane-active-border-style "fg=#39ff14"
set -g pane-border-lines single

set -g message-style "bg=#12401f,fg=#39ff14"
set -g message-command-style "bg=#12401f,fg=#ffb000"
setw -g mode-style "bg=#12401f,fg=#39ff14"

set -g display-panes-active-colour "#39ff14"
set -g display-panes-colour "#12401f"
set -g clock-mode-colour "#39ff14"
set -g clock-mode-style 24
