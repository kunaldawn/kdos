# KDOS tmux. Square, no powerline glyphs — DejaVu and Terminus have no Nerd
# Font shapes and half-drawn separators look broken. Colours come from
# ~/.config/tmux/themes/kdos.conf, sourced at the bottom and regenerated per
# accent by `kdos theme`.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",foot*:Tc,xterm-256color:Tc"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S · #W"

# Ctrl-a, because Ctrl-b fights readline word movement.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel

# ── the look ─────────────────────────────────────────────────────────
# The status bar's shape; its COLOURS are the generated theme's, below.
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g pane-border-lines single
set -g clock-mode-style 24

# The palette — every colour-bearing line lives in themes/kdos.conf, written
# per accent by `kdos theme` (the foot include pattern; `kdos theme` also
# reloads a running server). Guarded so a home the generator has not reached
# yet gets tmux's own colours rather than an error on every attach.
if-shell "test -r ~/.config/tmux/themes/kdos.conf" \
    "source-file ~/.config/tmux/themes/kdos.conf"
