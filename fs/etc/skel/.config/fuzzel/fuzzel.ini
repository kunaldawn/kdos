# KDOS "PHOSPHOR" — app launcher.
#
# This file is hand-written and stays that way: noctalia ships a fuzzel template
# too, but fuzzel has no include directive, so enabling it would overwrite the
# whole file rather than a colour block. `kdos theme` repaints fuzzel by
# rewriting the [colors] section below in place.

font=Terminus:pixelsize=18,DejaVu Sans Mono:size=12
prompt=">_ "
icons-enabled=yes
terminal=foot -e
lines=12
width=48
horizontal-pad=16
vertical-pad=12
inner-pad=6
layer=overlay

[colors]
background=000a03f2
text=b8ffc8ff
prompt=39ff14ff
input=e8ffeeff
match=39ff14ff
selection=12401fff
selection-text=39ff14ff
selection-match=ffb000ff
border=39ff14ff

[border]
width=2
radius=0
