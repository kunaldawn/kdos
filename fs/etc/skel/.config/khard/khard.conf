# LIVE, NOT COMMENTED OUT, for the same reason khal's is: khard with no
# addressbook entry answers `Error in config file … No address book entries
# available` and exits 3. This points at an empty book instead.
#
# `khard list` ON AN EMPTY BOOK PRINTS `Found no contacts` AND EXITS 1. That is
# khard's answer for "nothing matched", not a fault, and anything scripting it
# has to treat a non-zero exit as an empty result rather than as a failure.

[addressbooks]

# One vdir of .vcf files, beside the calendars and kept the same way.
[[personal]]
path = ~/.local/share/contacts/personal

[general]
# The editor a `khard edit` opens. Left to $EDITOR, which /etc/profile sets.
debug = no

[contact table]
# Family name first, so a list sorts the way a paper address book does.
display = first_name
sort = last_name
reverse = no
show_nicknames = yes
