# KDOS btop. Square corners, block graphs, phosphor theme.
# color_theme is rewritten by noctalia's template hook when the scheme changes,
# so this file must exist — btop's own apply step warns and gives up otherwise.

color_theme = "noctalia"
theme_background = True
truecolor = True
force_tty = False
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"
vim_keys = True
rounded_corners = False
graph_symbol = "block"
shown_boxes = "cpu mem net proc"
update_ms = 1500
proc_sorting = "cpu lazy"
proc_reversed = False
proc_tree = False
proc_colors = True
proc_gradient = True
proc_per_core = False
proc_mem_bytes = True
cpu_graph_upper = "total"
cpu_graph_lower = "total"
cpu_invert_lower = True
cpu_single_graph = False
cpu_bottom = False
show_uptime = True
check_temp = True
show_coretemp = True
temp_scale = "celsius"
base_10_sizes = False
show_cpu_freq = True
clock_format = "%H:%M:%S"
background_update = True
disks_filter = ""
mem_graphs = True
mem_below_net = False
show_swap = True
swap_disk = True
show_disks = True
only_physical = True
use_fstab = True
show_io_stat = True
io_mode = False
net_download = 100
net_upload = 100
net_auto = True
net_sync = True
show_battery = True
log_level = "WARNING"
