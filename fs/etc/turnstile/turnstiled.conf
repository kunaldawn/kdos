##
## turnstiled's configuration on KDOS: per-user services and the runtime
## directory, from a user's first login to that user's last logout.
##
## One `key = value` per line. A value turnstiled does not accept is logged to
## syslog and the key keeps its built-in default; a misspelt KEY is skipped
## without a word, and the default it leaves can be the wrong one (the backend
## falls back to `dinit`, which is not on this system). turnstiled(8) and
## turnstiled.conf(5) are the reference.

debug = no
debug_stderr = no

# The user services are /etc/kdos/user-services, run under ksvc by the backend
# /usr/lib/turnstile/ksvc. There is one backend for every account: the backend
# itself starts nothing for a system account (the `sddm` greeter), so the
# greeter still gets its runtime directory through pam_turnstile. The one
# system account it serves is plasma-setup's, whose first-boot wizard runs in
# a whole Plasma session.
backend = ksvc

# THE ONE OWNER OF /run/user/<uid>. turnstile makes it at a user's first login
# and removes it after the last logout, once the services in it have stopped;
# elogind is built with its own runtime-directory code removed, because two
# owners would delete each other's directory — elogind's at its last session,
# under the user services and boxes still using it. kdos-appbox hands every box
# /run/user/<uid> and DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/<uid>/bus,
# so the path is fixed and is never moved.
manage_rundir = yes
rundir_path = /run/user/%u

# Exported into every login's PAM environment once the backend has the session
# bus answering at $XDG_RUNTIME_DIR/bus, so Plasma and every box share it;
# kdos-session-wrapper refuses to start Plasma on any other.
export_dbus_address = yes

# A user's services, boxes included, stop at the last logout unless
# /var/lib/elogind/linger/<user> exists. That is the file
# `loginctl enable-linger` writes, and turnstile is built to read it there.
# Lingering needs manage_rundir, since only the owner of the directory can
# promise not to remove it.
linger = maybe

# The seconds a login waits for the backend to report its services ready. The
# backend's own waits stop at ten; past fifteen turnstiled gives the login up,
# services and runtime directory with it.
login_timeout = 15

# root logs in to a runtime directory and no services: nothing in
# /etc/kdos/user-services is for root, and the system's services are rcS's.
root_session = no
