# Generated by resolvconf
# The line above is openresolv's signature and must stay the first line:
# resolvconf refuses to replace a file that does not start with it, and the
# refusal fails every `resolvconf -a` — NetworkManager's, dhcpcd's and
# wg-quick's, which then tears its tunnel down. resolvconf rewrites this file
# when one of them brings up a link. Until then it names only this machine,
# where nothing answers before NetworkManager starts its dnsmasq, so a lookup
# made before the network is up fails at once and reaches no outside resolver.
nameserver 127.0.0.1
