# ---------------------------------
#   The least real-time priority every login gets: 1.
#
# KWin asks for SCHED_RR at the lowest real-time priority for the threads
# that read input and commit frames, so a busy machine does not stall the
# pointer. It gets it only with RLIMIT_RTPRIO >= 1 or CAP_SYS_NICE, and a
# file capability does not survive kpkg's archive, so this limit is the one
# route; without it KWin logs "Failed to gain real time thread priority" and
# runs its compositing at normal priority.
#
# pam_limits reads it at every PAM login — SDDM's, the greeter's (whose own
# 30-sddm.conf says the same for the sddm account), a console login and
# turnstile's session for the user services. `*` is the lowest-precedence
# entry pam_limits knows: a group entry outranks it whatever the file order,
# so the audio group's rtprio 95 in pipewire's 25-pw-rlimits.conf still
# applies to its members. The kernel's real-time throttle
# (kernel.sched_rt_runtime_us) keeps a process at priority 1 from taking more
# than 95% of a CPU.
# ---------------------------------

*	-	rtprio	1
