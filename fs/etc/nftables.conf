#!/usr/sbin/nft -f
#
# KDOS default firewall, loaded by /etc/init.d/25_nftables.sh.
#
# The policy is the one a workstation wants and is deliberately dull:
#   - anything this machine started, comes back
#   - loopback is trusted
#   - ICMP and ICMPv6 are ANSWERED, not dropped (see below)
#   - everything else arriving unasked is dropped
#   - everything going out is allowed
#
# It is a starting point a user is expected to edit, not a security product.
# Any service that should be reachable from the network needs a rule added
# here; the shipped file exists so that is an edit rather than an invention.

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		# The connection this machine opened, coming back. First rule
		# because it matches the overwhelming majority of packets.
		ct state established,related accept
		ct state invalid drop

		iif lo accept

		# ICMPv6 IS NOT OPTIONAL. Dropping it does not harden IPv6, it
		# breaks it: neighbour discovery, router advertisement and above
		# all Packet Too Big are how IPv6 works at all, and a host that
		# drops them gets a network that appears to connect and then
		# stalls on the first large transfer. This is the single most
		# common way a hand-written IPv6 firewall is wrong.
		ip6 nexthdr icmpv6 icmpv6 type {
			destination-unreachable,
			packet-too-big,
			time-exceeded,
			parameter-problem,
			echo-request,
			nd-router-advert,
			nd-neighbor-solicit,
			nd-neighbor-advert
		} accept

		# IPv4 echo and the unreachables path MTU discovery depends on.
		ip protocol icmp icmp type {
			destination-unreachable,
			time-exceeded,
			parameter-problem,
			echo-request
		} accept

		# mDNS, because avahi is installed and started by
		# fs/etc/init.d/45_avahi.sh — a machine that runs a responder
		# and firewalls its own port is advertising into a wall.
		udp dport 5353 accept

		# DHCPv6 client.
		udp dport 546 accept

		# A HOTSPOT'S CLIENTS NEED A LEASE AND A RESOLVER, and this is
		# the only place they can be let in. `kdos-net`'s hotspot is
		# NetworkManager's `ipv4.method = shared`, which starts dnsmasq
		# on the access point's own interface; NetworkManager's shared
		# table deliberately carries NO input chain, so with the policy
		# above a client associates, ARPs, answers a ping and never
		# gets an address.
		#
		# SCOPED TO THE SUBNET NetworkManager HANDS OUT, not to an
		# interface name this file cannot know: 10.42.0.0/16 is the
		# pool it allocates a /24 out of for every shared connection.
		# Off that subnet these two ports stay closed.
		ip saddr 10.42.0.0/16 udp dport { 53, 67 } accept
		ip saddr 10.42.0.0/16 tcp dport 53 accept

		# --- Add your own below. Examples, deliberately commented: ---
		# tcp dport 22   accept      # sshd (70_sshd.sh)
		# tcp dport 8080 accept      # kiwix-serve
		# tcp dport 631  accept      # cups, if this machine SHARES a printer
	}

	chain forward {
		# Nothing is routed through a workstation by default.
		type filter hook forward priority filter; policy drop;

		# EXCEPT A HOTSPOT, AND THE POLICY ABOVE IS WHY THIS HAS TO BE
		# HERE. NetworkManager registers its own forward chain on this
		# same hook with policy accept when a shared connection comes
		# up — but in netfilter an `accept` verdict ends only the chain
		# that issued it: the packet still meets every other base chain
		# on the hook, and a drop anywhere is final. So NetworkManager's
		# chain cannot rescue a packet this one drops, in either
		# registration order, and a hotspot would associate, lease an
		# address and route nothing.
		#
		# The subnet is NetworkManager's own shared pool, so this opens
		# forwarding for a hotspot and for nothing else.
		ct state established,related accept
		ip saddr 10.42.0.0/16 accept
		ip daddr 10.42.0.0/16 accept
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

# EVERYTHING UNDER /etc/nftables.d, LAST.
#
# A file there re-opens the `input` chain above and appends to it, which is
# why this include is at the bottom: nft evaluates rules in the order they
# were added, and the chain POLICY is what applies when none matched — so an
# accept appended here is still reached.
#
# `kdos-firewall` owns 50-kdos-services.nft and rewrites it whole. Anything
# hand-written belongs in another file beside it.
#
# A glob matching nothing is not an error, but the directory ships with that
# one file in it so the common case is never the untested one.
include "/etc/nftables.d/*.nft"
