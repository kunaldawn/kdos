# ---------------------------------
#   KD's Homebrew Linux Distro
# ---------------------------------
#
# SDDM, as KDOS runs it: a Wayland greeter on KWin, a Plasma Wayland session
# started through the KDOS session wrapper, and no X server anywhere on the
# login path.
#
# THE ORDER IS SDDM'S: /usr/lib/sddm/sddm.conf.d first (plasma-workspace's
# plasma-wayland.conf), then this directory by name, then /etc/sddm.conf, each
# key's last value winning. So this file overrides plasma-wayland.conf, and
# kde_settings.conf — written by the installer and by System Settings → Login
# Screen, and the one home of [Autologin] — overrides this one. A '#' ends a
# value as well as starting a comment, so no value below may contain one.

[General]
DisplayServer=wayland
# Comma-separated, and set for the greeter's compositor and the greeter alike:
# SDDM puts these in the environment of the helper that starts both. KDOS's
# defaults follow /etc/xdg here as in every login shell, or the greeter and its
# KWin read Breeze's instead.
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,XDG_CONFIG_DIRS=/etc/xdg:/usr/share/kdos/xdg
# Empty: the greeter's on-screen keyboard is plasma-keyboard, which its KWin
# starts as the Wayland input method. SDDM's own default loads the Qt virtual
# keyboard into the greeter as a second one.
InputMethod=
Numlock=none

[Wayland]
# plasma-wayland.conf's command. --inputmethod plasma-keyboard gives the greeter
# its on-screen keyboard. No --xwayland: KWin starts no X server without it, so
# none runs before a user session starts one. --locale1 takes the keyboard
# layout from locale1, which kdos-settingsd serves.
CompositorCommand=kwin_wayland --no-global-shortcuts --no-lockscreen --inputmethod plasma-keyboard --locale1
# SDDM runs this with the session's Exec= line as its one argument, in place of
# its own wayland-session script: the wrapper reads the login shell's profile,
# checks the session bus and warms the boxes before it execs Plasma.
SessionCommand=/usr/local/bin/kdos-session-wrapper
SessionDir=/usr/share/wayland-sessions

[X11]
# No directory, so no X session can ever be offered.
SessionDir=

[Users]
MinimumUid=1000
MaximumUid=60000
RememberLastUser=true
RememberLastSession=true

[Theme]
# The KDOS theme, matched to the splash and the lock screen. Accounts' pictures
# need no key: SDDM reads /var/lib/AccountsService/icons/<user> itself.
Current=kdos
CursorTheme=breeze_cursors
CursorSize=24
Font=Noto Sans,10
