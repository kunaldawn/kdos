# KDOS login — who tty1 logs in, and nothing else.
#
#   key = value
#
# Read by /usr/local/sbin/kdos-login, which /etc/inittab reaches through
# kdos-getty. One key, because there is one decision on this path: a machine
# with one account and no password has nothing to ask.
#
# THE INSTALLER EDITS THIS FILE AND NOT /etc/inittab. An installed system names
# the account it created here; a line in inittab would put a per-machine value
# in a file every image ships identically.

# The account tty1 logs in without asking. Comment it out to get a password
# prompt instead — agetty asks, and the rest of the login path is unchanged.
autologin = kdos
