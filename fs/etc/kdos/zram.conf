# Compressed swap in RAM. 12_zram.sh reads this; both keys are optional and
# an absent file means the defaults below.
#
# size is a PERCENTAGE OF RAM (1-90), not a byte count: the compressed pages
# live in the same memory, so this is how much swap the device may claim to
# hold, not how much it will occupy.
size = 50

# Any backend this kernel carries — zstd, lz4, lz4hc, deflate, 842, lzo. One it
# does not is reported and the kernel's own default is kept.
algorithm = zstd
