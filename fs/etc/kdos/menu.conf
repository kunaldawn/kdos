# KDOS routes — a name for every place in the system, and the command that
# opens it.
#
#   route = argv
#
# A ROUTE IS A NAME A SCRIPT CAN USE. A chord opens a surface and a person
# clicks a row, but neither is something a shell script, a documentation page
# or another program can refer to — `kdos menu summon setup.network` is, and it
# keeps working when the chord is rebound or the row moves.
#
# The name is `verb.noun`, lower case, and the verb is the shape of the thing
# being done rather than the program that does it: a person looking for the
# wifi is looking to SET SOMETHING UP, and does not know which of eleven
# surfaces owns it.
#
# The value is an argument vector, split on spaces and run without a shell.
# There is no quoting and there will not be: a route that needed a shell would
# be a route that could run anything a menu file said, and this file merges a
# user's copy over the system's.
#
# `~/.config/kdos/menu.conf` is read after this one. A route named there
# REPLACES the one here; a route named only there is added. Deleting a route
# is not possible and is not meant to be — a name that a script may hold is a
# name that must keep resolving.

# A key beginning `@` is a SETTING rather than a route: the value is read by
# the surface that cares about it, not run. There is no shell here either.

# WHICH SYSTEM ROWS THE START MENU KEEPS AT THE TOP LEVEL when it is too
# narrow for three columns. Below a hundred columns the system group folds
# behind one `Settings` row, and these labels stay listed beside it — a
# machine whose owner reaches for Bluetooth every day names Bluetooth here.
# The labels are the ones the menu draws; a label that names no row promotes
# nothing.
@toplevel          = Network Sound Displays Terminal

# Setting the machine up.
setup.network      = kdos-net
setup.bluetooth    = kdos-bt
setup.sound        = kdos-audio
setup.displays     = kdos-display
setup.devices      = kdos-devices
setup.printers     = kdos-print
setup.users        = kdos-users
setup.time         = kdos-time
# A terminal program becomes an application. `add` takes a display name and a
# command and writes the entry; with no arguments it prints what it wants, so
# the row is a starting point rather than a form — a four-field dialog is a
# surface nothing else here needs.
setup.tui          = kdos app tui

# How it looks.
style.theme        = kdos-style
# The screen's font, on the page beside the accent. `kdos-style` is one surface
# with two pages because they are one question — how the screen looks — and a
# second binary would be a second window to learn.
style.font         = kdos-style --page font
style.background   = kdos background next
style.panel        = kdos-settings --page panel
style.desktop      = kdos-settings --page desktop

# What it is doing.
system.settings    = kdos-settings
system.monitor     = kdos-res
system.power       = kdos-energy
system.disks       = kdos-disks
system.boxes       = kdos-res --page boxes
system.notifications = kdos-notify

# Learning it.
learn.keys         = kdos-keys
learn.docs         = kdos-doc

# Taking something off the screen.
capture.region     = kdos-shot region
capture.screen     = kdos-shot screen
# The screen into a file, through the portal. The same row again stops it: one
# screen and one portal session, so a second recording is not a thing to want,
# and a person who started one has to be able to end it from where they
# started it. `capture.sound` is the microphone and a different program.
capture.record     = kdos-record
capture.sound      = kdos-rec
# A QR on the screen, decoded to the clipboard and NEVER to disk: a QR is a
# wifi password or a pairing token more often than it is a URL, and a picture
# of one left in ~/Pictures is that secret kept where nobody meant to keep it.
capture.qr         = kdos-shot qr
# The slot name and hex of the cell under the pointer, onto the clipboard. A
# lookup and not a probe: every cell on the console carries the slot it was
# drawn in. The compositor tells no client where the pointer is, so this row
# says so there rather than doing nothing.
capture.colour     = kdos-shot colour

# Off this machine, over one code word. `croc` on this image is pinned to
# `--local`, so a transfer stays on this network and reaches no relay of
# anybody's; the receiving end runs `croc <code>` and the sending window says
# so. There is no `share.receive` row, because receiving is that one command
# and a surface around it would be a surface that only retypes it.
share.file         = kdos-share
share.clipboard    = kdos-share --clipboard

# The switches. `kdos toggle` with no argument lists them.
toggle.night       = kdos toggle night-light
toggle.quiet       = kdos toggle dnd
toggle.awake       = kdos toggle stay-awake

# What this machine is.
about.system       = kdos-about

# The shipped arrangements. A layout opens what is not already open and closes
# nothing, so a route is safe to press twice. One row per layout because a
# route is a name a script may hold: they are read from a file rather than
# found in a directory, and a layout somebody saves of their own gets its row
# in their own copy of this file.
layout.work        = kdos con layout load work
layout.write       = kdos con layout load write
layout.talk        = kdos con layout load talk
