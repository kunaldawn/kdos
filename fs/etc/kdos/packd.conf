# kdos-packd — the pack daemon.
#
# retain: how many SUPERSEDED versions of one pack the store keeps.
#
# `kdos app rollback` is a rename of a file that is still there, so a store
# that kept none could not roll anything back; a store that kept every version
# an application ever had would fill a disk with copies of a 400 MB pack
# nobody will launch again. One is the update you just took, undone.
#
# 0 is an honest off: rollback then answers "no earlier version is kept"
# rather than failing at a rename. The sweep runs after an install and at no
# other time — a sweep on a timer would be a background job deleting somebody's
# rollback while they were deciding whether to use it.
retain = 1
