# kdos-con — the console desktop.
#
# This file is the system's answer; ~/.config/kdos-con/con.conf overrides it
# key by key, and a key in neither file takes the built-in default. Every
# change applies at the next session start — the session reads this once, so
# that half its answers cannot come from before an edit and half from after.
#
# Chords are NOT here. They are in ~/.config/kdos-con/keys.conf, because which
# key runs the launcher is a keyboard question and which program IS the
# launcher is not.

# greet: whether tty1 asks who you are.
#
# `no` autologins the account named by `autologin` below, which is what the
# live medium wants: a machine with one account and no password has nothing to
# ask. The installer writes `yes` for an installed system, where it is a real
# question.
#
# Read by kdos-con-login before anything is drawn, so a change needs a reboot
# or a `kill` of the tty1 getty to take.
greet = no

# autologin: which account `greet = no` logs in.
#
# Renaming the desktop user means changing this line, or tty1 autologins an
# account that no longer exists and the machine is reachable only from tty2.
# Ignored entirely when `greet = yes`, where the answer is the one you type.
autologin = kdos

# remote: whether the session socket may be reached from another machine.
#
# `no` is the socket in $XDG_RUNTIME_DIR and nothing else — a desktop you can
# attach a view to from the same account on the same machine. `yes` does NOT
# open a port: there is no TCP listener anywhere in this desktop. It permits
# `kdos con attach` over an ssh channel that forwards the unix socket, which is
# why a remote desktop here needs no protocol of its own and no second
# authentication.
remote = no

# font: the console font kdos-view rasterises on a KMS device.
#
# Ignored by a view running inside a terminal, which draws with the terminal's
# font and has no say in it. A name fontconfig cannot resolve falls back to the
# built-in, so a typo costs legibility rather than a session.
font = monospace:size=12

# sessions: how many workspaces.
#
# Super+1..9 switches and Super+Shift+1..9 sends a window. Nine is the ceiling
# because nine is the last digit Super can reach — a tenth would exist with no
# way to get to it. Windows on a workspace above a lowered count are not lost;
# they are on a workspace nothing switches to, so raise it again to reach them.
sessions = 4

# scrollback: lines a terminal window keeps after they scroll off.
#
# Per window, not per session, so this multiplies by however many are open. A
# line is a cell array as wide as the window, so a wide window costs more per
# line than a narrow one; 0 keeps nothing.
scrollback = 2000

# terminal: what Super+Return opens.
#
# Opened in-process as a window of the session — this is the terminal's command
# line, not a terminal emulator to run. There is no shell in front of it: the
# line is split into an argument vector, so quoting works and redirection does
# not.
terminal = sh

# idle_saver, idle_lock, idle_off: seconds of no keyboard or pointer activity
# before the saver covers the screen, before the screen locks, and before it
# powers down. 0 means never.
#
# All three are measured from the LAST ACTIVITY rather than from the step
# before, so they read as they look and want to be written in increasing order.
# Activity takes the saver away and powers the screen back on; it does NOT
# unlock — only a password does that. The lock happens before the blank and
# never the other way, or a screen would come back on showing whatever was on
# it before it went dark.
#
# THERE IS NO idle_dim. comp.conf has one because a compositor can dim a
# framebuffer; a dim is a brightness, and this desktop's colours are eight
# palette slots with no brightness between them. A "dimmed" grid would be a
# different picture rather than a darker one. The saver is not a dim wearing a
# different name: it is a picture, which a grid draws exactly.
#
# IN A VIRTUAL MACHINE ALL THREE DEFAULT TO 0, whatever is written as the
# default below, because a blanked screen over VNC is indistinguishable from a
# crashed session. Setting a key here overrides that — including setting it to
# 0, which is how you say you mean it.
idle_saver = 300
idle_lock = 600
idle_off = 900

# menu, launcher, lock, saver: the programs the session starts.
#
# Each attaches as a surface of its own, so anything that speaks libkcon works
# here — including the same binaries the graphical desktop starts. The first
# three are started by their chords; `saver` is started by `idle_saver` above
# and by nothing else, and it must be a program that attaches with the SAVER
# role and exits when it is asked to close, or the screen keeps it.
menu = kdos-start
launcher = kdos-launcher
lock = kdos-lock
saver = kdos-saver

# embed: whether a graphical application becomes a window.
#
# `yes` starts kdos-cage --embed, which composites the application in a process
# of its own and hands the frames back; the session cuts them into sprites and
# the result is an ordinary window — chrome, snapping, workspaces, a taskbar
# entry, a close button. The session still links no wlroots and no pixel code,
# which is why a machine whose GPU driver is broken comes up anyway.
#
# `no` gives every graphical application a virtual terminal of its own instead,
# full screen, with the desktop staying on the terminal it was already on.
#
# TO PIN ONE APPLICATION rather than all of them, put `display = vt` in its box
# profile — an embedded guest is composited by pixman on the CPU, which is fine
# for an editor and is not a way to play a game. `kdos doctor` reports which
# applications are pinned.
embed = yes
