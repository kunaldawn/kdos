# kdos-con — the console desktop.
#
# This file is the system's answer; ~/.config/kdos-con/con.conf overrides it
# key by key, and a key in neither file takes the built-in default. Every
# change applies at the next session start — the session reads this once, so
# that half its answers cannot come from before an edit and half from after.
#
# Chords are NOT here. They are in ~/.config/kdos-con/keys.conf, because which
# key runs the launcher is a keyboard question and which program IS the
# launcher is not.

# greet: whether tty1 asks who you are.
#
# `no` autologins the account named by `autologin` below, which is what the
# live medium wants: a machine with one account and no password has nothing to
# ask. The installer writes `yes` for an installed system, where it is a real
# question.
#
# Read by kdos-con-login before anything is drawn, so a change needs a reboot
# or a `kill` of the tty1 getty to take.
greet = no

# autologin: which account `greet = no` logs in.
#
# Renaming the desktop user means changing this line, or tty1 autologins an
# account that no longer exists and the machine is reachable only from tty2.
# Ignored entirely when `greet = yes`, where the answer is the one you type.
autologin = kdos

# remote: whether the session socket may be reached from another machine.
#
# `no` is the socket in $XDG_RUNTIME_DIR and nothing else — a desktop you can
# attach a view to from the same account on the same machine. `yes` does NOT
# open a port: there is no TCP listener anywhere in this desktop. It permits
# `kdos con attach` over an ssh channel that forwards the unix socket, which is
# why a remote desktop here needs no protocol of its own and no second
# authentication.
remote = no

# font: the console font kdos-view rasterises on a KMS device.
#
# Ignored by a view running inside a terminal, which draws with the terminal's
# font and has no say in it. A name fontconfig cannot resolve falls back to the
# built-in, so a typo costs legibility rather than a session.
font = monospace:size=12

# taskbar: what the session's own bottom row shows — `windows` or `fkeys`.
#
# `windows` is a row of the open windows. `fkeys` is Norton Commander's row:
# F1 to F10 and what each does, which a person's hands learn in a week.
#
# THE ROW NAMES THE CHORD AND DOES NOT BIND THE KEY. A bare F7 belongs to
# whatever is running in the focused window — that is what makes a function-key
# row possible on a terminal desktop at all — so each cell is a pointer target
# that fires `Super+F<n>`, and the label carries the Super.
#
# This is the SESSION's bar, and it stands down when the shell's panel docks:
# a desktop running kdos-shell sees that panel's row instead, whatever this
# says.
taskbar = windows

# sessions: how many workspaces.
#
# Super+1..9 switches and Super+Shift+1..9 sends a window. Nine is the ceiling
# because nine is the last digit Super can reach — a tenth would exist with no
# way to get to it. Windows on a workspace above a lowered count are not lost;
# they are on a workspace nothing switches to, so raise it again to reach them.
sessions = 4

# scrollback: lines a terminal window keeps after they scroll off.
#
# Per window, not per session, so this multiplies by however many are open. A
# line is a cell array as wide as the window, so a wide window costs more per
# line than a narrow one; 0 keeps nothing.
scrollback = 2000

# a11y: bring the desktop up on a view that keeps the kernel's text plane.
#
# `--kms` takes the terminal into graphics mode, which is what makes the screen
# fast and what stops `brltty` reading /dev/vcsa. A `--tty` view on the same
# terminal leaves the text plane intact, so a braille display reads the console
# desktop with nothing else installed and nothing else running.
#
# It costs the pixel half: no pictures on the screen and no font chords. That
# is the trade, and it is a person's to make rather than a default.
a11y = no

# speak: start the screen reader with the session.
#
# `kdos-a11y` connects to the reader's socket — the third one, whose clients
# may not type — and says what each widget announces through espeak-ng. It is
# off by default because a machine that starts talking to somebody who did not
# ask is a machine they have to work out how to silence.
speak = no

# views: how many displays may be attached at once; 0 is no limit.
#
# A session and its displays are separate processes, so a person can attach a
# second one — a screen here and the same desktop over ssh. The cap is here for
# the machine that should only ever have one: a view that is refused is told
# why rather than finding a closed socket.
#
# A view that watches without typing is a separate question and a separate
# flag: `kdos con attach --observe`.
views = 0

# restore: open again what was open, when a session is started under the same
# name.
#
# The LIST comes back — which windows there were, how big, where and on which
# workspace — and nothing else. A process cannot be restored: a terminal is
# reopened running `terminal` below, and an application is started through its
# desktop entry by its app id. Nothing in the state file is ever run as a
# command, because that file is written by a program and read by a program.
#
# Saved on a clean exit only. A session that was killed keeps the list from the
# last time it left properly, which is better than the empty one a crash would
# write over it.
restore = no

# restore_scrollback: put the last session's output back on a restored
# terminal's screen.
#
# Off by default, and separately from `restore`, because this is the half that
# can mislead: old output above a fresh prompt reads as live, and somebody
# scrolling up finds a build that never ran in this session. What is put back
# is marked in the terminal as the previous session's — the line is the whole
# reason the key can be turned on at all.
restore_scrollback = no

# terminal: what Super+Return opens.
#
# Opened in-process as a window of the session — this is the terminal's command
# line, not a terminal emulator to run. There is no shell in front of it: the
# line is split into an argument vector, so quoting works and redirection does
# not.
terminal = sh

# files, mail, browser, music, agenda, chat, writing: the seven programs
# Super+e and Super+Shift+{e,b,u,c,g,w} reach.
#
# ONE KEY PER PROGRAM: the chord raises the window running it, and starts it
# when none is. Pressing the chord again while that window has the focus cycles
# to the next window of the same program, so three terminals under one chord
# are all reachable.
#
# THE CHORD NAMES A ROLE AND THIS FILE NAMES THE PROGRAM. Which key opens the
# mail is a keyboard question and belongs in keys.conf; which program IS the
# mail is this one's. Each is an argument vector split without a shell, and
# every one runs in a terminal — a graphical program named here would open in a
# terminal and draw nothing.
#
# A KEY POINTED AT A PROGRAM THAT IS NOT INSTALLED IS NOT AN ERROR. The chord
# starts nothing and the key card drops its row, so a card never offers a key
# that opens nothing.
files   = mc
mail    = aerc
browser = lynx
music   = rmpc
agenda  = ikhal
chat    = iamb
writing = micro

# idle_saver, idle_lock, idle_off: seconds of no keyboard or pointer activity
# before the saver covers the screen, before the screen locks, and before it
# powers down. 0 means never.
#
# All three are measured from the LAST ACTIVITY rather than from the step
# before, so they read as they look and want to be written in increasing order.
# Activity takes the saver away and powers the screen back on; it does NOT
# unlock — only a password does that. The lock happens before the blank and
# never the other way, or a screen would come back on showing whatever was on
# it before it went dark.
#
# THERE IS NO idle_dim. comp.conf has one because a compositor can dim a
# framebuffer; a dim is a brightness, and this desktop's colours are eight
# palette slots with no brightness between them. A "dimmed" grid would be a
# different picture rather than a darker one. The saver is not a dim wearing a
# different name: it is a picture, which a grid draws exactly.
#
# IN A VIRTUAL MACHINE ALL THREE DEFAULT TO 0, whatever is written as the
# default below, because a blanked screen over VNC is indistinguishable from a
# crashed session. Setting a key here overrides that — including setting it to
# 0, which is how you say you mean it.
idle_saver = 300
idle_lock = 600
idle_off = 900

# menu, launcher, lock, saver: the programs the session starts.
#
# Each attaches as a surface of its own, so anything that speaks libkcon works
# here — including the same binaries the graphical desktop starts. The first
# three are started by their chords; `saver` is started by `idle_saver` above
# and by nothing else, and it must be a program that attaches with the SAVER
# role and exits when it is asked to close, or the screen keeps it.
menu = kdos-start

# palette: one search over everything the desktop can reach — windows,
# applications, routes, settings pages, files and chords — on Super+space.
#
# BESIDE `menu` AND NOT INSTEAD OF IT. A keyboard wants to type a name and a
# pointer wants to read rows, so the taskbar's Start button opens the menu and
# this chord opens the search. `kdos menu summon <route>` opens THIS with the
# route already typed, falling back to `menu` when this names nothing.
palette = kdos-palette

# setup_menu: the same search, seeded with the group every panel is filed
# under. Eleven of them have a chord and the rest do not, and a person looking
# for the printers is looking to set something up rather than for a program
# name — which is what a route is for.
setup_menu = kdos-palette --route setup

launcher = kdos-launcher
lock = kdos-lock
saver = kdos-saver

# saver_mode: which effect the saver draws.
#
#   art        the picture in screensaver.txt, drifting and bouncing
#   bounce     the same thing, under the name the effect is known by
#   rain       falling columns of shade; needs no picture
#   matrix     the same columns as characters instead of shades
#   pipes      pipes that grow, turn, and clear the screen when it fills
#   starfield  stars flying past
#   fire       the demo effect, climbing the palette from dim to text
#   clock      the time in block digits, drifting like the art
#   random     one of the above, chosen when the saver starts
#
# `--mode NAME` on the `saver` line above BEATS this key, which is what lets a
# frame be dumped for a golden on a machine whose own /etc/kdos/con.conf says
# something else.
#
# A NAME THIS DOES NOT KNOW FALLS BACK TO `art` rather than refusing to start:
# a screensaver that would not come up because a key was misspelled is a black
# screen with nothing on it to explain why.
saver_mode = art

# The surfaces the chords below reach, on the same rule: which key runs a thing
# is keys.conf's, which program is the thing is this file's.
#
# These are this desktop's own, and they are here rather than as literals in
# the chord table so that one place says what a chord runs and `kdos-con --keys`
# prints it — the card cannot then name a program the session does not start.
#
# `displays` lists the screens the attached view is driving and sets a mode on
# one. Off, scale and rotate stay the compositor's: a text grid has no scale
# factor, and a rotated screen would give its cells a different shape from the
# one beside it.
keys = kdos-keys
audio = kdos-audio
net = kdos-net
bluetooth = kdos-bt
devices = kdos-devices
settings = kdos-settings
calendar = kdos-cal
docs = kdos-doc
displays = kdos-display
power = kdos-energy
monitor = kdos-res
calculator = kdos-calc
notes = kdos-note
clipboard = kdos-clip
# contacts: the address book, on Super+Ctrl+b. The STORE is `khard` and this
# window holds none — it forks it per query and copies what you pick.
contacts = kdos-contacts
find = kdos-find
capture = kdos-shot
capture_menu = kdos-palette --route capture
capture_screen = kdos-shot screen
record = kdos-record

# The two notices and the three reminder verbs. Each computes its own text, so
# each is a `kdos` verb rather than a string this file could hold: a chord runs
# one command and cannot ask what the time is.
time = kdos notify --time
battery = kdos notify --battery
remind = kdos remind --ask
remind_ls = kdos remind ls
remind_clear = kdos remind clear

# The notices on the screen. Each is one line down `kdos-notifyd`'s own socket,
# so what is drawn has one owner and there is no second daemon.
dismiss = kdos notify --dismiss
dismiss_all = kdos notify --dismiss-all
dnd = kdos notify --dnd
undismiss = kdos notify --raise
stay_awake = kdos toggle stay-awake
night_light = kdos toggle night-light

# The media keys, and they run a program because what "louder" means is the
# mixer's business and what "next" means is the player's.
#
# A KMS VIEW ONLY. A media key produces no character, so no terminal reports
# one: these work on tty1 and are dead over ssh, which is a limit of the wire
# and not of this file.
volume_up = kdos-osd volume +5
volume_down = kdos-osd volume -5
volume_mute = kdos-osd volume mute
media_play = kdos-mpctl toggle
media_stop = kdos-mpctl stop
media_next = kdos-mpctl next
media_prev = kdos-mpctl prev

# nowplaying: whether the bar shows what is playing, left of the pager.
#
# The line comes from `kdos-mpctl watch`, which asks mpd and writes it; the
# session reads that file and speaks no media protocol of its own. With nothing
# writing the file there is no field, so turning this off is for somebody who
# does not want the space taken rather than somebody with no music.
#
# THIS BAR IS DRAWN ONLY WHEN kdos-shell's PANEL IS NOT UP. That panel reads the
# same file through its own `mpris` widget and this key does not reach it; the
# widget's row is `right` in panel.conf.
nowplaying = yes

# embed: whether a graphical application becomes a window.
#
# `yes` starts kdos-cage --embed, which composites the application in a process
# of its own and hands the frames back; the session cuts them into sprites and
# the result is an ordinary window — chrome, snapping, workspaces, a taskbar
# entry, a close button. The session still links no wlroots and no pixel code,
# which is why a machine whose GPU driver is broken comes up anyway.
#
# `no` gives every graphical application a virtual terminal of its own instead,
# full screen, with the desktop staying on the terminal it was already on.
#
# TO PIN ONE APPLICATION rather than all of them, put `display = vt` in its box
# profile — an embedded guest is composited by pixman on the CPU, which is fine
# for an editor and is not a way to play a game. `kdos doctor` reports which
# applications are pinned.
# Ask before an UNBRACKETED paste that carries a newline.
#
# With bracketed paste on the child sees the text as text and decides for
# itself; with it off the bytes go straight to the pty and a newline EXECUTES —
# at a plain shell, at an ssh password prompt, inside `read`. It is the one
# place a terminal can be made to act as the user, and a clipboard that can
# arrive from a forwarded view is what makes it something other than a thought
# experiment.
#
# The session cannot raise a dialog over a window whose toolkit it does not
# own, so the refusal is the answer: the first attempt is declined and the
# taskbar says why, and pressing the chord again within five seconds means it.
paste_guard = yes

# remember: whether a window opens where that program's window last was.
#
# The rectangle is kept per program and per workspace in
# ~/.local/state/kdos/con/geometry and written when a window goes, so an
# application stops opening in the middle of the screen at the size its author
# picked. `no` turns it off in both directions — a person who does not want the
# behaviour does not want the file written either.
#
# CHROME IS NEVER REMEMBERED: a menu, a toast, the icon layer, a docked panel,
# the lock and the saver are placed by their role rather than by a person. Nor
# is the scratchpad, which has a shape of its own on every show.
#
# A RESTORED SESSION WINS. `restore` above puts a window back where the last
# session had it, which is a stronger statement than where the program usually
# sits; this fills in for everything the session record does not name.
#
# The graphical desktop keeps the same idea in comp.conf's `window_memory`, in
# its own file: those rectangles are pixels and these are cells.
remember = yes

embed = yes
