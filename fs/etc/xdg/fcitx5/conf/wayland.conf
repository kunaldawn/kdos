# ---------------------------------
#   fcitx5's Wayland module: KWin owns the keyboard layout list.
#
# fcitx5 reads conf/wayland.conf from ~/.config/fcitx5 if it exists, else the
# first fcitx5/conf/wayland.conf along XDG_CONFIG_DIRS (/etc/xdg when the
# variable is unset), the same lookup as fcitx5/config beside it.
#
# With the override on, its compiled default, fcitx5 writes the current
# group's layout (`us`, from the skel profile) into ~/.config/kxkbrc as
# LayoutList at every start and on every input-method change. That replaces
# every layout the installer, locale1 or System Settings -> Keyboard set, and
# the lock screen then checks a password typed on the US layout. With it off,
# fcitx5 decodes keys with the keymap KWin hands it.
# ---------------------------------

Allow Overriding System XKB Settings=False
