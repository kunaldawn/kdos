# ---------------------------------
#   fcitx5's classic UI: the candidate window follows the KDOS look.
#
# fcitx5 reads conf/classicui.conf from ~/.config/fcitx5 if it exists, else
# the first fcitx5/conf/classicui.conf along XDG_CONFIG_DIRS, as it reads
# wayland.conf beside it; a copy System Settings -> Input Method writes to
# the user's directory replaces this one whole.
#
# fcitx5's compiled default draws the candidate window in its light theme
# whatever the session's scheme, a white strip on every dark accent. With
# UseDarkTheme it follows the portal's color-scheme instead: default-dark
# under the seven dark accents, default under Paper. UseAccentColor takes
# the highlight from the portal's accent-color, the accent `kdos theme`
# set. The KCM's "KDE Plasma" theme is not used: upstream marks it
# experimental, and it depends on fcitx5-plasma-theme-generator answering
# at every start.
# ---------------------------------

Theme=default
DarkTheme=default-dark
UseDarkTheme=True
UseAccentColor=True
