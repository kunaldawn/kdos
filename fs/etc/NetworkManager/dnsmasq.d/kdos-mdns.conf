# KDOS: the `local` domain is multicast DNS. NetworkManager's dnsmasq, which
# /etc/resolv.conf names, forwards it to kdos-mdnsd (45_mdns.sh), which asks
# avahi-daemon and answers with a ten-second TTL that dnsmasq caches. With
# this line gone, a `.local` name reaches no resolver on musl.
server=/local/127.0.0.1#5380
