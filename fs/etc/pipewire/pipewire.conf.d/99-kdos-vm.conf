# How much audio PipeWire keeps in the sound card when the card is emulated.
#
# A VIRTUAL MACHINE'S SOUND CARD HAS NO CLOCK OF ITS OWN. The emulated codec
# advances its DMA position from the emulator's main loop -- the same loop that
# uploads the display -- so the position moves in bursts rather than at a
# steady rate. PipeWire computes its own wakeups from that position and aims to
# keep about one quantum in the device, so a wakeup that lands later than the
# quantum is silence: the card runs out before the next block is written, and
# the underrun is the player's, not the card's, so nothing appears in dmesg.
#
# pipewire.conf already lifts the floor to 1024 frames under a hypervisor,
# which is enough for a device whose clock is steady. 4096 frames is 85 ms at
# 48 kHz, and the ceiling moves with it because a floor above the ceiling is
# not a range. Measured on this image against a 1920x1080 accelerated display:
# the card holds 85 ms at worst and 127 ms typically, against 42 ms and 64 ms
# at the shipped floor.
#
# A host that is still late needs 8192, at 170 ms of latency, which is where a
# beat and the flash it drives start to visibly disagree. 4096 is the largest
# buffer that costs a demo nothing.
#
# THE RULE IS WHAT KEEPS REAL HARDWARE PROMPT. `cpu.vm.name` is set only under
# a hypervisor, so a machine booted off metal keeps the 1024-frame floor and
# the 21 ms of latency that goes with it. Check which one is in force with
# `pw-metadata -n settings`.
context.properties.rules = [
    {   matches = [ { cpu.vm.name = !null } ]
        actions = {
            update-props = {
                default.clock.quantum     = 4096
                default.clock.min-quantum = 4096
                default.clock.max-quantum = 8192
            }
        }
    }
]
