# ---------------------------------
#   Samba on KDOS: a standalone file server whose shares are the users'.
#
# A folder is shared from Dolphin's Properties > Share tab, which creates a
# USERSHARE with `net usershare` and reads the settings below through
# `testparm`. A usershare is one file in `usershare path`; smbd picks it up
# with no restart. Without these lines the tab can only say that sharing is
# not set up, and every share fails.
#
# THE DIRECTORY IS THE PERMISSION. `net usershare` writes there as the user,
# so it must be root's, group sambashare, mode 1770: only a member of the
# group can add a share, and the sticky bit stops one member deleting
# another's. The share tab adds its user to the group through an
# administrator prompt. The samba package's service script makes the
# directory at every boot, whether or not smbd then starts: a package cannot
# carry that mode.
#
# smbd runs only while something is shared. /etc/init.d/83_samba.sh starts
# it at boot when the usershare directory holds a share or this file defines
# one below [global], and skips it otherwise. The first folder shared from
# Dolphin starts it at once: the session's kded-kdos sees the new usershare
# and asks kdos-powerd, through polkit, to run that script. Other machines
# reach a share only once the firewall's `smb` service is opened in System
# Settings or with `kdos-power firewall smb on`; until then port 445 is
# closed.
#
# Printers are not shared: CUPS shares its own over IPP, and a Samba printer
# share would offer every local queue to every SMB client. A share defined
# here by hand, below [global], is served as well as the users' shares.
# ---------------------------------

[global]
	workgroup = WORKGROUP
	server role = standalone server
	server string = KDOS
	map to guest = bad user

	usershare path = /var/lib/samba/usershares
	usershare max shares = 100
	usershare allow guests = yes
	usershare owner only = yes

	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes
