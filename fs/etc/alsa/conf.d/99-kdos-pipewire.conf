# ALSA's `default` device, and the one file on this image that chooses it.
#
# THE DIRECTORY PIPEWIRE INSTALLS ITS DROP-IN INTO IS NOT READ. The @hooks list
# in /usr/share/alsa/alsa.conf loads /var/lib/alsa/conf.d, /usr/etc/alsa/conf.d,
# /etc/alsa/conf.d, /etc/asound.conf and ~/.asoundrc -- and NOT
# /usr/share/alsa/alsa.conf.d, where pipewire's own 50-pipewire.conf and
# 99-pipewire-default.conf land. With no file HERE, `default` falls through to
# alsa-lib's built-in card chain, plug -> softvol -> dmix: every ALSA program
# talks to the card directly, the first one to open it owns it, and the
# PipeWire daemon runs with no device at all. A dmix client's underrun is
# raised in USERSPACE, so the stutter that follows shows no xrun on the card
# and nothing in dmesg.
#
# EVERY REDEFINITION BELOW NEEDS ITS `!`, AND THE `!` IS NOT STYLE. The hooks
# run AFTER the rest of alsa.conf is parsed, so `pcm.default` already exists
# there as a string. A plain `pcm.default { ... }` does not lose a race, it
# aborts the whole load -- "default is not a compound", then "may be old or
# corrupted", and then every ALSA program on the machine has no configuration
# at all. Check any edit with `aplay -L` before believing anything else.
#
# THE CONTROL DEVICE IS DELIBERATELY LEFT ON THE HARDWARE. pipewire ships a
# `ctl.!default { type pipewire }` beside its pcm; this file does not adopt it.
# kdos-shell's volume applet attaches snd_mixer to `default` and has to keep
# working when PipeWire is what went wrong -- a mixer that needs the sound
# server is a mixer that cannot fix it.

pcm.kdos_pipewire {
	type pipewire
	playback_node "-1"
	capture_node "-1"
	hint {
		show on
		description "Default Audio Device (PipeWire)"
	}
}

# THE BUILT-IN CARD CHAIN, REACHABLE BY NAME. `sysdefault` is alsa-lib's own
# per-card default -- plug -> softvol -> dmix -- and nothing here overrides it,
# so this name is the card and only the card. It is EXCLUSIVE in both
# directions: while a dmix client holds the device PipeWire cannot open it, and
# while PipeWire holds the device this fails to open. That is the whole reason
# `default` is not this.
pcm.kdos_card {
	type plug
	slave.pcm "sysdefault"
	hint {
		show on
		description "Sound Card (no sound server)"
	}
}

# A LOGIN THAT RUNS NO SESSION SCRIPT HAS NO PIPEWIRE, AND NOTHING STARTS ONE
# FOR IT. kdos_session_audio() is called from kdos-con-start and
# kdos-desktop-start only; tty2 is a plain getty, and so are a serial console,
# an ssh login and anything init starts. A compiled-in `type pipewire` would
# leave every ALSA program on those paths unable to open a device at all --
# libmikmod's driver, to name the one that matters, opens the literal name
# `default` and parses no options. So the choice is an environment variable:
#
#     KDOS_ALSA_DEFAULT=kdos_card kdos-bb
#
# Any pcm name defined above is accepted. An undefined one fails with "Unknown
# PCM <name>" and an absent daemon with "Host is down": both are loud, and
# neither is silence.
pcm.!default {
	type plug
	slave.pcm {
		@func getenv
		vars [
			KDOS_ALSA_DEFAULT
		]
		default "kdos_pipewire"
	}
}
