#
# elogind's [Login] settings on KDOS. A drop-in: elogind reads its built-in
# defaults, then /etc/elogind/logind.conf, then every logind.conf.d/*.conf in
# name order, so a file here numbered above 50 overrides a key below. The
# [Sleep] keys are read from sleep.conf and sleep.conf.d only, which is why
# they are in sleep.conf.d/50-kdos.conf and not here.

[Login]
# A logout ends the session, not the user's processes. Boxes (rootless
# podman) and the user services turnstile runs outlive the login that started
# them, and stop at the user's last logout through turnstile unless the user
# lingers; with `yes` elogind would kill them under every logout, the warm
# boxes of the next login included.
KillUserProcesses=no

# The POSIX shared memory and SysV IPC of a user whose last session closed are
# left alone. A lingering user's box and its audio clients keep segments that
# elogind would otherwise remove under them.
RemoveIPC=no

# Each session's cgroup is /sys/fs/cgroup/<session>, with the processes in its
# `session` leaf and a `delegated` subtree the user owns, so rootless podman
# has a subtree in which to apply a box profile's memory, CPU and pids limits.
# Needs the pure cgroup2 mount fstab gives /sys/fs/cgroup and the controllers
# 15_cgroups.sh enables at the root.
DelegateSessionCgroups=yes

# Lid and power key at the greeter and on a console login. Inside a Plasma
# session PowerDevil takes the handle-* inhibitors and its own settings decide,
# so these apply only where no session holds them.
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
HandlePowerKey=poweroff

# How long a suspend waits for the delay inhibitors taken before it: the
# screen locker locks on PrepareForSleep and KWin blanks, and a suspend that
# outran them would wake to an unlocked desktop.
InhibitDelayMaxSec=5
