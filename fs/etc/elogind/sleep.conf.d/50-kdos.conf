#
# elogind's [Sleep] settings on KDOS, a drop-in read after
# /etc/elogind/sleep.conf in name order.

[Sleep]
# Suspend to RAM only. KDOS swaps to zram (/etc/init.d/12_zram.sh), which is
# memory and holds nothing across a power-off, so there is no disk image to
# resume from. With these off, CanHibernate and the hybrid calls answer `no`
# and PowerDevil and the Leave menu offer no action that would lose the
# session.
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
