net.ipv4.ping_group_range = 0 2147483647

# A PROGRAM THAT DIES SAYS SO IN THE KERNEL LOG.
#
# Without this a segmentation fault is silent: the process is gone, its window
# with it, and nothing anywhere names the program or the address. On a desktop
# whose surfaces are separate processes that is the difference between "the
# terminal closed" and a fault with a faulting instruction — and the log is
# `dmesg`, which survives the session restarting.
kernel.print-fatal-signals = 1
