net.ipv4.ping_group_range = 0 2147483647

# A PROGRAM THAT DIES SAYS SO IN THE KERNEL LOG.
#
# Without this a segmentation fault is silent: the process is gone, its window
# with it, and nothing anywhere names the program or the address. On a desktop
# whose surfaces are separate processes that is the difference between "the
# terminal closed" and a fault with a faulting instruction — and the log is
# `dmesg`, which survives the session restarting. The kernel is built with
# CONFIG_SECURITY_DMESG_RESTRICT, so reading it takes root: `sudo dmesg`.
kernel.print-fatal-signals = 1

# LINKS IN A STICKY WORLD-WRITABLE DIRECTORY ARE NOT FOLLOWED FOR SOMEONE ELSE.
#
# /tmp is a shared 1777 tmpfs, and every init script, timer and package hook
# runs as root. The kernel leaves all four of these at 0, and at 0 a user who
# plants a symlink, hardlink, FIFO or file at a name a root job is about to
# write redirects that write onto any file on the machine.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 1
fs.protected_regular = 2

# PER-TASK DELAY ACCOUNTING IS ON.
#
# The kernel is built with it and leaves it off. Off, iotop has no IO% or
# SWAPIN% column and htop's CPU, IO and swap delay columns read N/A. On, the
# scheduler reads the clock around every wait it accounts — a small cost on
# every context switch, and the reason the kernel ships it off.
kernel.task_delayacct = 1

# NO ROUTE IS TAKEN FROM AN ICMP REDIRECT, AND NONE IS SENT.
#
# A redirect rewrites this machine's route to a destination on the word of
# whoever sends it, so on a shared Wi-Fi any host on the link can put itself in
# the path. The kernel accepts them by default. This machine is a router only
# for its hotspot and its containers, whose clients have no other route to
# correct, so it sends none either.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# A PACKET IS DROPPED WHEN NO ROUTE LEADS BACK TO ITS SOURCE.
#
# 2 is the loose check: the source must be reachable through some interface,
# not necessarily the one the packet came in on. It drops spoofed sources from
# nowhere and leaves alone the asymmetric routes a VPN, a hotspot, podman's
# bridge and a Babel mesh all make; the strict check, 1, breaks each of those.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# KERNEL ADDRESSES ARE HIDDEN FROM EVERY ACCOUNT BUT ROOT.
#
# At 0 /proc/kallsyms, /proc/modules and the kernel log's %pK pointers give
# any user the layout that address randomisation hides. At 1 they read as
# zeroes to an account without CAP_SYSLOG; root's perf and crash tools still
# see them.
kernel.kptr_restrict = 1
