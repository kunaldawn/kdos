<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
██╗  ██╗██████╗  ██████╗ ███████╗
██║ ██╔╝██╔══██╗██╔═══██╗██╔════╝
█████╔╝ ██║  ██║██║   ██║███████╗
██╔═██╗ ██║  ██║██║   ██║╚════██║
██║  ██╗██████╔╝╚██████╔╝███████║
╚═╝  ╚═╝╚═════╝  ╚═════╝ ╚══════╝
- - - - - - - - - - - - - - - - -
  JetBrains Mono is KDOS's monospace.

`monospace` is a list, and the first face in it that has a glyph draws that
glyph. JetBrains Mono comes first. Noto Sans Mono draws what it lacks of
Latin Extended, Greek and Cyrillic at the same cell. Neither has a single
braille pattern, which btop and every terminal plot draw with, and the one
fixed-width face on the image that has all 256 is Terminus (TTF), so it comes
third: a gap costs a different fixed-width face, never a proportional one.
testing/monofont.py measures each block against this chain.

The file name decides the order. fontconfig reads conf.d in name order and
runs each file's rules in the order they are written.

A program that asks for "JetBrains Mono" by name, as Konsole and KDE's fixed
font do, falls back along `monospace` for a missing glyph only because the
<default> below adds `monospace` to its request. 49-sansserif adds
`sans-serif` to any request that names no generic family yet, so this file
runs before it, as 45-latin's own family-to-generic rules do; numbered past
49, a JetBrains Mono request would fall back to Noto Sans and DejaVu Sans
first. The <default> comes before the <prefer> for the same reason: run
after it, the `monospace` it adds would get 60-latin's DejaVu list instead
of this one.

A <prefer> puts its faces ahead of the family it matched as it runs, so the
first file to run keeps the head of the list: this one runs before
noto-fonts' 56-noto-preferred, which prefers Noto Sans Mono, and before
60-latin's DejaVu Sans Mono.

Terminus as a whole face is Phosphor mode's, which names "Terminus (TTF)"
itself; here it only ever draws a glyph the two faces above it do not have.
75-yes-terminus admits the bitmap Terminus only for a program that names it.
- - - - - - - - - - - - - - - - -
-->
<fontconfig>
  <alias>
    <family>JetBrains Mono</family>
    <default><family>monospace</family></default>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Noto Sans Mono</family>
      <family>Terminus (TTF)</family>
    </prefer>
  </alias>
</fontconfig>
