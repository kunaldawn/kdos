# KDOS boot menu for an INSTALLED system. The live ISO gets its own copy,
# written by script/06_packaging/02_iso.sh — keep the two in step.
#
# The banner needs graphics mode; rEFInd falls back to its own title text if
# the file is missing, so an ESP without kdos-banner.png still boots.

timeout 10
banner /EFI/BOOT/kdos-banner.png
banner_scale noscale
hideui hints,badges
showtools reboot, shutdown, firmware
use_graphics_for linux

menuentry "KDOS" {
    icon /EFI/BOOT/icons/os_linux.png
    loader /EFI/BOOT/bzImage
    initrd /EFI/BOOT/init.cpio
    options "console=tty0 console=ttyS0 loglevel=3 quiet"
}

menuentry "KDOS (verbose)" {
    icon /EFI/BOOT/icons/os_linux.png
    loader /EFI/BOOT/bzImage
    initrd /EFI/BOOT/init.cpio
    options "console=tty0 console=ttyS0 loglevel=7"
}
