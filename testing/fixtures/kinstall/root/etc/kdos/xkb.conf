# /etc/kdos/xkb.conf — the keyboard layout the login screen and every new
# session start with.
#
# kdos-settingsd serves these four values as org.freedesktop.locale1's
# X11Model, X11Layout, X11Variant and X11Options. The login screen's
# compositor (kwin_wayland --locale1) reads them before anybody can type, and
# startplasma copies them into each session as the XKB_DEFAULT_* variables;
# a person's own layout in System Settings comes after that and wins.
#
# AN EMPTY XKBLAYOUT FOLLOWS THE CONSOLE: the layout is then the one nearest
# the console keymap in /etc/keymap, the file the installer writes. A layout
# written here is kept as written. plasma-setup's keyboard page writes it on
# a first boot; the Keyboard page of System Settings sets one person's layout
# and leaves this file alone. Change it with
#
#     dbus-send --system --print-reply --dest=org.freedesktop.locale1 \
#         /org/freedesktop/locale1 org.freedesktop.locale1.SetX11Keyboard \
#         string:de string:pc105 string: string: boolean:true boolean:true
#
# rather than by hand: the daemon checks each value against xkeyboard-config,
# sets the nearest console keymap with it (the first `true`) and tells the
# login screen at once. A value here is the plain word XKB uses (letters,
# digits and `_+,:.-`), so the file is also valid shell.
XKBMODEL=
XKBLAYOUT=
XKBVARIANT=
XKBOPTIONS=
