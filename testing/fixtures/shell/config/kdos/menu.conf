# The routes the golden searches. A fixture rather than the shipped file: the
# menu reads /etc/kdos/menu.conf first and no test host has one, so what this
# frame proves is the USER half of the merge — a route named only here is
# added, which is the whole of what a person's copy does.
setup.network      = kdos-net
setup.printers     = kdos-print
style.theme        = kdos-settings --page appearance
