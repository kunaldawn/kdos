# ---------------------------------
#   ports/appbox/packs.conf — the pack set, one row per pack
# ---------------------------------
#
#   <kind>  <id>  <parent>  <apt packages …>
#
# `kind` is base | runtime | app. `parent` is the pack this one is built ON
# TOP of, and it becomes the row's `requires =` — so the stage's diff layer
# contains only what this row adds, and nothing is curated by hand.
#
# ORDER MATTERS: a row's parent must appear above it. The runtimes are factored
# out first so the bytes dozens of applications share are stored once, which is
# the whole reason a 3.9 GB monolith becomes a set of packs somebody chooses
# from.
#
# A row's third field is a PACK id, not an image tag. `ports/appbox/packs`
# resolves it to the image it built for that pack.

base    base      -        bash bc bzip2 ca-certificates curl diffutils findutils gnupg2 less libnss-myhostname libvte-2.91-common libvte-common lsof man-db manpages mount ncurses-base passwd pinentry-curses procps sudo tar time tree tzdata unzip util-linux wget xz-utils zip libgl1-mesa-dri libegl1 libgl1 mesa-vulkan-drivers adwaita-icon-theme hicolor-icon-theme librsvg2-common fonts-dejavu fonts-liberation fonts-noto-core dbus-x11 xdg-utils desktop-file-utils shared-mime-info

# The GTK runtime, and the Qt→GTK platform themes with it: kdos-appbox only
# exports QT_STYLE_OVERRIDE=Fusion when the box can supply a palette through
# qgtk3, and Fusion without one falls back to Qt's built-in LIGHT palette.
runtime rt-gtk    base     libgtk-3-0t64 libgtk-4-1 libadwaita-1-0 gtk-update-icon-cache qt5-gtk-platformtheme qt6-gtk-platformtheme

# Qt and the KDE frameworks the KDE applications need. plasma-integration is
# what makes QT_QPA_PLATFORMTHEME=kde work at all; kio-extras and the
# thumbnailers are what make dolphin show pictures rather than generic icons.
runtime rt-qt     base     libqt5widgets5t64 libqt6widgets6 qt6-wayland qtwayland5 plasma-integration kio-extras ffmpegthumbs kdegraphics-thumbnailers

runtime rt-media  base     ffmpeg gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav pipewire-audio-client-libraries

runtime rt-sci    base     python3 python3-numpy python3-scipy python3-matplotlib

# Electron's shared set. VSCodium needs --no-sandbox in the box regardless:
# chrome-sandbox wants a setuid helper and CLONE_NEWUSER, and gets neither.
runtime rt-electron base   libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbfile1 libsecret-1-0

runtime rt-wine   base     wine wine64 wine32

# ── the applications ──────────────────────────────────────────────────────
# One row per application, so editing one rewrites ONE pack. Under the
# monolith, editing a segment rewrote that segment's whole 485 MB blob.

app app.zathura      rt-gtk       zathura zathura-pdf-poppler zathura-djvu zathura-cb
app app.calibre      rt-qt        calibre
app app.foliate      rt-gtk       foliate
