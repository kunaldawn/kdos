# winetricks is NOT a row, and the Containerfile carrying it is the odd one
# out rather than a gap here. It is in `contrib`, and it fetches Windows
# runtimes from the network at run time — which an offline distro cannot
# promise, and which `docs`/CLAUDE.md already record as the reason there are no
# corefonts for wine. `cabextract` goes with it. The decision is four rows up,
# beside `app.wine`; this note exists so the next person to diff the
# Containerfile against this file does not re-add it a third time.
