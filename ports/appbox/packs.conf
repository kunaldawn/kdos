# ── PARITY WITH THE MONOLITH ───────────────────────────────────────────────
#
# Every row below is an application `ports/appbox/Containerfile` installs and
# `packs.conf` did not, which is the whole of what stands between the pack lane
# and W7-5. The set was not curated: it is the difference between the two files,
# minus the three that are NATIVE ports here already (git, gnuplot, mpv) and
# minus the support packages, which belong to a runtime or to the row that
# needs them — `breeze` and `kio` to rt-kde, `cabextract` to winetricks,
# `genisoimage` and `dvdauthor` to the burner, the `libretro-*` cores to
# RetroArch. Deleting the monolith with any of these unrowed would delete a
# working application from the distribution.
#
# ONE ROW PER APPLICATION, which is W9-1's rule and is why five small GNOME
# games are five packs rather than one `app.games`: a pack is what somebody
# chooses, and nobody chooses "games".

# GTK applications
