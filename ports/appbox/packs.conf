# ---------------------------------
#   ports/appbox/packs.conf — the pack set, one row per pack
# ---------------------------------
#
#   <kind>  <id>  <parent>  <apt packages …>
#
# `kind` is base | runtime | app. `parent` is the pack this one is built ON
# TOP of, and it becomes the row's `requires =` — so the stage's diff layer
# contains only what this row adds, and nothing is curated by hand.
#
# ORDER MATTERS: a row's parent must appear above it. The runtimes are factored
# out first so the bytes dozens of applications share are stored once, which is
# the whole reason a 3.9 GB monolith becomes a set of packs somebody chooses
# from.
#
# A row's third field is a PACK id, not an image tag. `ports/appbox/bake`
# resolves it to the image it built for that pack.
#
# `recommended =` is the one line that says what a default install SUGGESTS. It
# becomes `recommended = yes` in each named pack's metadata and `R:yes` in the
# index, which is the only thing kinstall's Applications page preselects from.
# The base and the runtimes are not listed: they are carried always, because an
# application pack is a diff over a runtime and leaving one out installs
# applications that cannot start.
# `auto` takes the snapshot date from the base image's own sources file, so the
# packages installed on top cannot disagree with the rootfs under them. A
# literal 20260824T000000Z pins explicitly; `off` reads the live archive and
# gives up reproducibility.
snapshot = auto

recommended = app.firefox-esr app.libreoffice app.gimp app.zathura app.keepassxc
#
# `env <pack> NAME=VALUE` becomes an `env =` line in that pack's metadata, and
# kdos-appbox exports the whole stack's worth when it enters a pack box. This
# is the pack lane's answer to the monolith's image labels: a pack box is
# `podman --rootfs`, so there is no image to inspect and the fact has to travel
# with the packages it describes.
#
# QT_STYLE_OVERRIDE is only safe where a platform theme is present — Fusion
# with none falls back to Qt's built-in LIGHT palette, which is worse than
# leaving it alone. rt-qt has qgtk3, so it is safe there; rt-kde needs no
# override, because Breeze reads the same kdeglobals `kdos theme` writes.
env rt-qt   QT_QPA_PLATFORMTHEME=gtk3
env rt-qt   QT_STYLE_OVERRIDE=Fusion
env rt-kde  QT_QPA_PLATFORMTHEME=kde

# `deb <pack> <releases-api> <asset-pattern>` — for an application Debian does
# not carry. The newest asset matching the pattern is fetched and handed to
# apt, so its dependencies resolve normally.
deb app.vscodium https://api.github.com/repos/VSCodium/vscodium/releases/latest amd64.deb

# `cmd <pack> <name>` — for software that is a COMMAND rather than an
# application, whose own desktop entries are NoDisplay and correctly dropped.
cmd app.wine wine

# WHAT EVERY BOX PAYS FOR, and nothing else. Two things are deliberately out:
# mesa-vulkan-drivers is 241 MB and 26 packages for an API one application in
# this file might use, so it rides on that application; and libvte-*-common is
# distrobox's terminal integration, which a pack box does not have — kdos-boxinit
# is pid 1 here.
# A SECOND BASE, AND IT COSTS ONE LINE. `kdos-box create <n> base=image:<ref>`
# is an ONLINE operation and says so; the bases worth CARRYING are the ones
# that need no network. alpine is ~3 MB of busybox and musl — a clean scratch
# userland to try something in without touching the machine you are sitting on,
# and the one non-Debian rootfs small enough that carrying it is free.
#
# NO PACKAGES, DELIBERATELY. The image as it stands IS the deliverable. A row
# with an empty package list emits no apt line at all, which is the only way a
# non-Debian rootfs can be a row: everything below `FROM` in a generated
# Containerfile is apt, and against alpine it dies on `apt-get: not found`.
#
# Pinned to a POINT release, like every other version in this tree: `alpine:3`
# and `latest` are the same name for different bytes on different days.
image   alpine    alpine:3.24.1
base    alpine    -

base    base      -        bash bc bzip2 ca-certificates curl diffutils findutils gnupg2 less libnss-myhostname lsof man-db manpages mount ncurses-base passwd pinentry-curses procps sudo tar time tree tzdata unzip util-linux wget xz-utils zip libgl1-mesa-dri libegl1 libgl1 adwaita-icon-theme hicolor-icon-theme librsvg2-common fonts-dejavu fonts-liberation fonts-noto-core dbus-x11 xdg-utils desktop-file-utils shared-mime-info

runtime rt-gtk    base     libgtk-3-0t64 libgtk-4-1 libadwaita-1-0 gtk-update-icon-cache

# Qt, and NOTHING KDE. qt6-wayland/qtwayland5 are the platform PLUGIN and are
# not optional: without them every Qt app falls back to xcb under an Xwayland
# built with no GLX. The qgtk3 platform THEME is what gives them the KDOS
# palette, read out of ~/.themes/KDOS in the home the box shares — which is why
# GTK is pulled in here, and it is 95 MB against plasma-integration's 284.
runtime rt-qt     base     libqt5widgets5t64 libqt6widgets6 qt6-wayland qtwayland5 qt5-gtk-platformtheme qt6-gtk-platformtheme

# The KDE applications' own layer. plasma-integration is what makes
# QT_QPA_PLATFORMTHEME=kde work at all, and kio-extras with the two
# thumbnailers are what make dolphin show pictures rather than generic icons.
#
# IT IS A LAYER OVER rt-qt AND NOT PART OF IT. Measured on trixie: kio-extras
# and the thumbnailers are 392 MB and 215 packages, plasma-integration 284 MB
# more — all of which calibre, krita, keepassxc, wireshark, stellarium,
# hydrogen, lmms and openscad would otherwise carry to draw a thumbnail in a
# file manager they do not have.
runtime rt-kde    rt-qt    plasma-integration kio kio-extras kde-cli-tools breeze breeze-icon-theme kimageformat-plugins ffmpegthumbs kdegraphics-thumbnailers

runtime rt-media  base     ffmpeg gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav pipewire-audio-client-libraries

runtime rt-sci    base     python3 python3-numpy python3-scipy python3-matplotlib

# Electron's shared set. VSCodium needs --no-sandbox in the box regardless:
# chrome-sandbox wants a setuid helper and CLONE_NEWUSER, and gets neither.
runtime rt-electron base   libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbfile1 libsecret-1-0

# wine32 is i386-only; `bake` enables the architecture for a row that names
# one. Without it a 32-bit Windows binary — which most old ones are — has
# nothing to run on.
runtime rt-wine   base     wine wine64 wine32:i386

